<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DnD Monster Database – V18</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">

<style>

*{
  box-sizing:border-box;
}

html,
body{
  height:100%;
}

body{
  margin:0;
  background:#181818;
  color:white;
  font-family:Arial,sans-serif;
  overflow:hidden;
}

.container{
  display:grid;
  grid-template-columns:minmax(0,1fr) 470px;
  gap:20px;
  padding:20px;
  height:100vh;
  align-items:start;
  transition:grid-template-columns .25s ease;
}

.container.sidebar-collapsed{
  grid-template-columns:minmax(0,1fr) 0;
}

.table-section{
  min-width:0;
  height:calc(100vh - 40px);
  overflow:auto;
  border-radius:16px;
}

.sidebar{
  background:#242424;
  border-radius:16px;
  padding:22px;
  position:sticky;
  top:20px;
  height:calc(100vh - 40px);
  overflow:auto;
  border:1px solid #3a3a3a;
  transition:transform .25s ease,opacity .25s ease;
}

.container.sidebar-collapsed .sidebar{
  opacity:0;
  pointer-events:none;
  overflow:hidden;
}

h1,
h2,
h3{
  font-family:"Cinzel",serif;
}

.topbar{
  margin-bottom:16px;
}

input,
select,
button{
  width:100%;
  padding:11px;
  border-radius:10px;
  border:1px solid #444;
  background:#1d1d1d;
  color:white;
  font-size:15px;
}

button{
  cursor:pointer;
}

select{
  cursor:pointer;
}

input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button{
  -webkit-appearance:none;
  margin:0;
}

input[type="number"]{
  -moz-appearance:textfield;
  appearance:textfield;
}

.filter-group{
  margin-bottom:20px;
}

.filter-group > label{
  display:block;
  margin-bottom:8px;
  font-weight:bold;
}

.range-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.region-preset-row{
  margin:0 0 6px;
}

.region-preset-row select{
  width:100%;
}

.region-preset-hint{
  margin:0 0 9px;
  color:#777;
  font-size:10px;
  line-height:1.35;
}

/* =========================================================
   LEBENSRAUM AKTIONEN
========================================================= */

.habitat-actions{
  display:grid;
  grid-template-columns:1.35fr 1fr 1fr;
  gap:7px;
  margin-bottom:9px;
}

.habitat-action{
  width:auto;
  padding:7px 8px;
  font-size:12px;
  font-weight:bold;
  background:#303030;
  border:1px solid #4a4a4a;
}

.habitat-action:hover{
  background:#3a3a3a;
}

.habitat-action.apply{
  background:#4f46e5;
  border-color:#6d63ff;
}

.habitat-action.apply:hover{
  background:#5b52ef;
}

/* =========================================================
   EINZIGARTIGE
========================================================= */

.unique-toggle{
  display:flex;
  align-items:center;
  gap:9px;
  width:max-content;
  padding:7px 10px;
  border:1px solid #444;
  border-radius:8px;
  background:#292929;
  color:#aaa;
  font-size:13px;
}

.unique-toggle:hover{
  background:#333;
  color:#ddd;
}

.unique-toggle-indicator{
  width:14px;
  height:14px;
  border:1px solid #666;
  border-radius:4px;
  background:#1d1d1d;
}

.unique-toggle.active{
  color:white;
}

.unique-toggle.active .unique-toggle-indicator{
  background:#4f46e5;
  border-color:#7c74ff;
}

/* =========================================================
   KLIMA
========================================================= */

.climate-select{
  display:flex;
  gap:8px;
}

.climate-select button{
  width:auto;
  flex:1;
  background:#333;
  padding:10px 12px;
}

.climate-select button.active{
  background:#4f46e5;
  border-color:#7c74ff;
}

/* =========================================================
   REGIONSPROFIL
========================================================= */

 .region-profiles{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:7px;
}

.region-row{
  min-width:0;
  display:grid;
  grid-template-columns:minmax(0,1fr) 16px;
  grid-template-rows:auto auto;
  align-items:center;
  column-gap:4px;
  row-gap:2px;
  min-height:52px;
  padding:6px 7px;
  background:#292929;
  border:1px solid #3b3b3b;
  border-radius:8px;
  overflow:hidden;
}

.region-name-button{
  min-width:0;
  width:100%;
  padding:2px 0;
  border:none;
  background:transparent;
  color:#aaa;
  text-align:left;
  font-size:11px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  grid-column:1 / -1;
}

.region-name-button:hover{
  color:white;
}

.region-row.active .region-name-button{
  color:white;
  font-weight:bold;
}

.region-stars{
  display:flex;
  align-items:center;
  gap:5px;
  min-width:0;
  width:100%;
  grid-column:1;
}

.region-slider{
  width:100%;
  min-width:0;
  accent-color:#4f46e5;
}

.region-value{
  width:32px;
  min-width:32px;
  text-align:right;
  color:#eee;
  font-size:10px;
  font-variant-numeric:tabular-nums;
}

.region-row:not(.active) .region-stars{
  display:none;
}

.region-row:not(.active){
  min-height:34px;
  grid-template-rows:auto;
}

.sidebar .region-remove{
  width:16px;
  min-width:16px;
  max-width:16px;
  flex:0 0 16px;
  padding:2px 0;
  margin:0;
  background:transparent;
  border:none;
  color:#888;
  font-size:14px;
  line-height:1;
}

.region-remove:hover{
  color:white;
}

/* =========================================================
   TABELLE
========================================================= */

table{
  width:100%;
  border-collapse:separate;
  border-spacing:0;
  background:#222;
  border-radius:14px;
}

th,
td{
  padding:12px;
  text-align:left;
  vertical-align:top;
  border-bottom:1px solid #3f3f3f;
  border-right:1px solid rgba(255,255,255,.06);
  box-shadow:inset -1px 0 0 rgba(255,255,255,.03);
}

th:last-child,
td:last-child{
  border-right:none;
}

th{
  background:#303030;
  position:sticky;
  top:0;
  z-index:50;
  box-shadow:0 2px 10px rgba(0,0,0,.35);
}

.sortable{
  cursor:pointer;
  user-select:none;
}

.sortable:hover{
  background:#3b3b3b;
}

.sort-arrow{
  margin-left:6px;
  font-size:12px;
  opacity:.8;
}

tbody tr:nth-child(even){
  background:#242424;
}

tbody tr:nth-child(odd){
  background:#2c2c2c;
}

tbody tr{
  transition:background .18s ease,box-shadow .18s ease;
}

tbody tr:hover{
  background:#353535;
  box-shadow:
    inset 3px 0 0 #6d63ff,
    inset 0 0 0 1px rgba(255,255,255,.04);
}

/* =========================================================
   MONSTER
========================================================= */

.monster-cell{
  display:flex;
  align-items:center;
  gap:8px;
  min-width:220px;
}

.monster-link{
  color:#8ecbff;
  text-decoration:none;
  font-weight:bold;
}

.monster-link:hover{
  text-decoration:underline;
}

.info-button{
  width:auto;
  padding:4px 7px;
  background:#333;
  border:1px solid #4a4a4a;
  border-radius:6px;
  color:#aaa;
  font-size:11px;
  line-height:1;
}

.info-button:hover{
  background:#444;
  color:white;
}

.edit-monster-button{
  width:auto;
  min-width:26px;
  margin-left:3px;
}

/* =========================================================
   WERTE
========================================================= */

.unique-yes{
  color:#ff9b42;
  font-weight:bold;
}

.unique-no{
  color:#aaa;
}

.score{
  font-weight:bold;
  white-space:nowrap;
}

.score-total{
  font-size:16px;
}

.score-detail{
  margin-top:6px;
  display:flex;
  flex-wrap:wrap;
  gap:5px 12px;
  font-size:12px;
  line-height:1.35;
  color:#d5d5d5;
}

.score-detail-item{
  white-space:nowrap;
}

.score-detail-name{
  opacity:.85;
  margin-right:4px;
}

.score-detail-stars{
  display:none;
}

.score-detail{
  gap:2px 10px;
  font-size:11px;
  line-height:1.25;
}

.score-detail-item{
  white-space:nowrap;
}

.biome-edit-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:8px;
}

.biome-edit-item{
  background:#2c2c2c;
  border:1px solid #3d3d3d;
  border-radius:8px;
  padding:8px;
}

.biome-edit-item label{
  display:block;
  font-size:11px;
  color:#bbb;
  margin-bottom:5px;
}

.biome-edit-item input{
  width:100%;
  padding:7px 8px;
  font-size:13px;
}

.editor-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:10px;
}

.editor-status{
  margin-top:8px;
  min-height:16px;
  font-size:12px;
  color:#aaa;
}

/* =========================================================
   TEMPERATUR RANGE
========================================================= */

.temperature-range-wrap{
  position:relative;
  height:34px;
  margin:1px 5px 5px;
  touch-action:none;
  user-select:none;
}

.temperature-track,
.temperature-track-active{
  position:absolute;
  left:0;
  right:0;
  top:15px;
  height:4px;
  border-radius:4px;
}

.temperature-track{
  background:#555;
}

.temperature-track-active{
  background:#4f46e5;
  z-index:1;
}

.temperature-handle{
  position:absolute;
  top:7px;
  width:18px;
  height:18px;
  border:2px solid #ddd;
  background:#4f46e5;
  z-index:4;
  box-shadow:0 0 0 0 transparent;
  cursor:grab;
  box-sizing:border-box;
}

.temperature-handle:active{
  cursor:grabbing;
}

.temperature-handle:focus-visible{
  outline:2px solid #fff;
  outline-offset:2px;
}

/* Wenn beide Werte gleich sind, liegen beide Halbgriffe exakt
   übereinander und ergeben optisch einen Kreis. Sie bleiben
   trotzdem separat greifbar: linke Hälfte = Minimum,
   rechte Hälfte = Maximum. */
.temperature-handle-left{
  border-radius:50% 0 0 50%;
  border-right:none;
}

.temperature-handle-right{
  border-radius:0 50% 50% 0;
  border-left:none;
}

.temperature-scale{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:2px;
  color:#aaa;
  font-size:9px;
  text-align:center;
  line-height:1.2;
}

.temperature-scale span:nth-child(3){
  color:#fff;
  font-weight:bold;
}

.temperature-current{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-top:9px;
  padding-top:8px;
  border-top:1px solid #3a3a3a;
  color:#888;
  font-size:12px;
}

.temperature-current b{
  color:#eee;
}

/* =========================================================
   SUCHE
========================================================= */

.search-row{
  display:flex;
  gap:8px;
}

.search-row input{
  flex:1;
}

.search-row button{
  width:auto;
  padding:0 14px;
  background:#383838;
  border:1px solid #555;
  font-weight:bold;
}

/* =========================================================
   SIDEBAR TOGGLE
========================================================= */

.toggle-sidebar{
  display:none;
  position:fixed;
  top:16px;
  right:16px;
  z-index:10000;
  width:auto;
  padding:12px 16px;
  border:none;
  border-radius:12px;
  background:#4f46e5;
  color:white;
  font-weight:bold;
}

.desktop-toggle{
  display:block;
}

/* =========================================================
   MOBILE
========================================================= */

.mobile-cards{
  display:none;
}

.mobile-card{
  background:#242424;
  border:1px solid #3f3f3f;
  border-radius:16px;
  padding:16px;
  margin-bottom:14px;
}

.mobile-card-title{
  font-size:18px;
  font-weight:bold;
  margin-bottom:12px;
  display:flex;
  align-items:center;
  gap:8px;
}

.mobile-card-title a{
  color:#8ecbff;
  text-decoration:none;
}

.mobile-card-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.mobile-label{
  font-size:12px;
  opacity:.7;
}

.mobile-value{
  font-size:14px;
}

.mobile-score{
  font-size:18px;
  font-weight:bold;
}

/* =========================================================
   MODAL
========================================================= */

.modal-backdrop{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:20000;
  padding:20px;
}

.modal-backdrop.open{
  display:flex;
}

.modal{
  width:min(760px,100%);
  max-height:90vh;
  overflow:auto;
  background:#242424;
  border:1px solid #444;
  border-radius:16px;
  box-shadow:0 12px 40px rgba(0,0,0,.5);
}

.modal-header{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:20px;
  padding:20px 22px;
  border-bottom:1px solid #3f3f3f;
}

.modal-title{
  margin:0;
  font-size:24px;
}

.modal-close{
  width:auto;
  padding:6px 10px;
  background:#333;
  border:1px solid #4a4a4a;
  font-size:18px;
}

.modal-body{
  padding:22px;
}

.modal-meta{
  display:flex;
  flex-wrap:wrap;
  gap:10px 20px;
  margin-bottom:22px;
  color:#ccc;
}

.modal-section{
  margin-bottom:22px;
}

.modal-section h3{
  margin:0 0 12px 0;
}

.profile-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.profile-item{
  padding:9px 10px;
  background:#2c2c2c;
  border:1px solid #3d3d3d;
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.profile-item-name{
  color:#ddd;
}

.profile-item-score{
  white-space:nowrap;
  color:#f0c75e;
  letter-spacing:1px;
}

.modal-link{
  display:inline-block;
  padding:9px 12px;
  background:#4f46e5;
  border-radius:8px;
  color:white;
  text-decoration:none;
  font-weight:bold;
}

.modal-link:hover{
  background:#5b52ef;
}

/* =========================================================
   SCROLL TOP
========================================================= */

#scrollTopBtn{
  position:fixed;
  bottom:20px;
  right:20px;
  width:54px;
  height:54px;
  border:none;
  border-radius:50%;
  background:#4f46e5;
  color:white;
  font-size:24px;
  font-weight:bold;
  cursor:pointer;
  z-index:10001;
  opacity:0;
  pointer-events:none;
  transition:opacity .2s ease,transform .2s ease;
  box-shadow:0 4px 12px rgba(0,0,0,.35);
}

#scrollTopBtn.show{
  opacity:1;
  pointer-events:auto;
}

#scrollTopBtn:hover{
  transform:translateY(-2px);
}


/* =========================================================
   KOMPAKTER FILTERBEREICH
========================================================= */

.filter-meta-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

.filter-meta-row .search-row{
  flex:1;
  min-width:0;
  max-width:none;
}

.filter-meta-row .search-row input{
  min-width:0;
  height:34px;
  padding:7px 10px;
  font-size:12px;
}

.filter-meta-row .search-row button{
  height:34px;
  width:34px;
  padding:0;
  flex:0 0 34px;
}

.filter-meta-row .unique-toggle{
  flex:0 0 auto;
  padding:7px 9px;
  font-size:12px;
}

.result-summary{
  display:flex;
  align-items:center;
  gap:6px;
  color:#8f8f8f;
  font-size:12px;
  white-space:nowrap;
}

.result-summary b{
  color:#eee;
}



@media(min-width:701px){

  .sidebar{
    padding:14px;
    height:calc(100vh - 40px);
    overflow:hidden;
  }

  .sidebar .filter-group{
    margin-bottom:13px;
  }

  .sidebar .filter-group > label{
    margin-bottom:6px;
    font-size:13px;
  }

  .sidebar input,
  .sidebar select,
  .sidebar button{
    padding:9px;
    font-size:13px;
    border-radius:8px;
  }

  .sidebar .range-grid{
    gap:8px;
  }

  .sidebar .region-preset-row select{
    padding:9px;
  }

  .sidebar .region-preset-hint{
    margin-bottom:7px;
    font-size:9px;
    line-height:1.25;
  }

  .sidebar .habitat-actions{
    gap:6px;
    margin-bottom:7px;
  }

  .sidebar .habitat-action{
    padding:6px 7px;
    font-size:11px;
  }

  .sidebar .region-row{
    min-height:30px;
  }

  .sidebar .temperature-filter{
    padding:9px 8px 8px;
  }

}
/* =========================================================
   MOBILE MEDIA
========================================================= */

@media(max-width:700px){

  body{
    overflow:auto;
  }

  .container{
    display:flex !important;
    flex-direction:column !important;
    padding:14px;
    height:auto;
  }

  .table-section{
    height:auto;
    max-height:none;
    overflow:visible;
  }

  .sidebar{
    order:-1;
    position:fixed;
    left:0;
    top:0;
    width:100%;
    max-width:100%;
    height:100vh;
    overflow-y:auto;
    z-index:9999;
    border-radius:0;
    transform:translateX(100%);
    transition:transform .25s ease;
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .toggle-sidebar{
    display:block;
  }

  .desktop-toggle{
    display:none;
  }

  .table-section table{
    display:none !important;
  }

  thead,
  tbody{
    display:none !important;
  }

  .mobile-cards{
    display:block;
  }

  .region-profiles{
    grid-template-columns:1fr 1fr;
  }

  .region-row{
    min-height:32px;
  }

  .region-name-button{
    font-size:11px;
  }

  .region-star{
    font-size:11px;
  }

  h1{
    font-size:28px;
    line-height:1.2;
    margin-right:90px;
  }

  .profile-grid{
    grid-template-columns:1fr;
  }

}


@media(min-width:701px){

  .sidebar{
    padding:14px;
    overflow:hidden;
  }

  .filter-group{
    margin-bottom:12px;
  }

  .filter-group > label{
    margin-bottom:6px;
  }

  .region-preset-row select{
    padding:8px 9px;
    font-size:12px;
  }

  .habitat-actions{
    gap:6px;
    margin-bottom:7px;
  }

  .habitat-action{
    padding:6px 7px;
    font-size:11px;
  }

  .region-profiles{
    gap:5px;
    grid-template-columns:repeat(3,minmax(0,1fr));
  }

  .region-row{
    min-height:30px;
  }

  .temperature-filter{
    padding:8px;
  }

  .temperature-current{
    margin-top:6px;
    padding-top:6px;
  }

}

.mode-nav{
  display:flex;
  gap:2px;
  margin:0 20px 10px;
  padding-top:10px;
  position:relative;
  z-index:200;
}
.mode-tab{display:none;
  width:auto;
  padding:9px 14px;
  border:1px solid #333;
  border-bottom:none;
  border-radius:10px 10px 0 0;
  background:#242424;
  color:#ddd;
  font-size:16px;
}
.mode-tab.active{
  background:#dbe5f0;
  color:#1e5fbf;
  font-weight:bold;
}
.mode-tab span{font-size:12px; margin-left:4px;}
.region-editor-view{display:none !important; min-width:0;}
.region-editor-view.open{display:block;}
.region-editor-card{
  background:#242424;
  border:1px solid #3f3f3f;
  border-radius:16px;
  padding:20px;
  min-height:calc(100vh - 90px);
  overflow:auto;
}
.region-editor-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:20px;
  margin-bottom:18px;
}
.region-editor-head h2{margin:0 0 4px;}
.region-editor-head p{margin:0;color:#999;font-size:13px;}
.region-editor-selects{display:flex;gap:8px;min-width:360px;}
.region-editor-selects select{width:auto;flex:1;}
.region-editor-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:12px;
}
.region-editor-item{
  background:#2c2c2c;
  border:1px solid #444;
  border-radius:10px;
  padding:12px;
}

<script>

/* =========================================================
   GOOGLE SHEET
========================================================= */

const SHEET_ID =
  "1e85bCRc0C0cN-tWKYto4bC8iSIm3lZc0zBHLsON1T3Q";

const SHEET_NAME =
  "Sheet1";

const REGION_SHEET_NAME =
  "Regionen";

// Einmalig die Google-Apps-Script-Web-App-URL eintragen,
// damit Schnellkorrekturen direkt ins Sheet geschrieben werden können.
const SHEET_WRITE_URL =
  "https://script.google.com/macros/s/AKfycbx6oOSHrVO8USWV4zxJsHDQxNPLMHf3CYOfKOHGH9N6y-An0lzBg3Cwa6ZcMxBCm2Qt-A/exec";


/* =========================================================
   HABITATE
========================================================= */

const HABITATS = [

  { label:"Wald",       columnIndex:5  },
  { label:"Grasland",   columnIndex:6  },
  { label:"Wüste",      columnIndex:7  },
  { label:"Sumpf",      columnIndex:8  },
  { label:"Gebirge",    columnIndex:9  },
  { label:"Küste",      columnIndex:10 },
  { label:"Fluss/See",  columnIndex:11 },
  { label:"Meer",       columnIndex:12 },
  { label:"Höhle",      columnIndex:13 },
  { label:"Untergrund", columnIndex:14 },
  { label:"Ruinen",     columnIndex:15 },
  { label:"Siedlung",   columnIndex:16 }

];


/* =========================================================
   KLIMA
========================================================= */

const CLIMATES = [

  { label:"Kalt" },
  { label:"Gemäßigt" },
  { label:"Heiß" }

];

/*
   TEMPERATUR
   Spalte R = Index 17

   Wertebereich: 0–1
*/
const TEMPERATURE_COLUMN_INDEX = 17;


/* =========================================================
   CR
========================================================= */

const CR_VALUES = [

  { label:"Alle", value:null },
  { label:"0",    value:0 },
  { label:"1/8",  value:0.125 },
  { label:"1/4",  value:0.25 },
  { label:"1/2",  value:0.5 }

];

for(let i=1;i<=30;i++){

  CR_VALUES.push({
    label:String(i),
    value:i
  });

}


/* =========================================================
   STATE
========================================================= */

let monsters = [];

let regionPresets = [];

let regionWeights = {};

let appliedRegionWeights = {};

let selectedTemperatureMin =
  0.50;

let selectedTemperatureMax =
  0.50;

let appliedTemperatureMin =
  0.50;

let appliedTemperatureMax =
  0.50;

let showUnique =
  false;

let sortColumn =
  "name";

let sortDirection =
  "asc";


/* =========================================================
   CR DROPDOWNS
========================================================= */

function buildCRDropdowns(){

  const minSelect =
    document.getElementById("crMin");

  const maxSelect =
    document.getElementById("crMax");


  minSelect.innerHTML = "";
  maxSelect.innerHTML = "";


  CR_VALUES.forEach(cr => {

    const minOption =
      document.createElement("option");

    minOption.value =
      cr.value === null
        ? ""
        : cr.value;

    minOption.textContent =
      cr.label;

    minSelect.appendChild(
      minOption
    );


    const maxOption =
      document.createElement("option");

    maxOption.value =
      cr.value === null
        ? ""
        : cr.value;

    maxOption.textContent =
      cr.label;

    maxSelect.appendChild(
      maxOption
    );

  });


  minSelect.value = "";
  maxSelect.value = "";

}


/* =========================================================
   REGIONEN
========================================================= */

function getSheetRowsFromText(
  text
){

  const json =
    JSON.parse(
      text.substring(47).slice(0,-2)
    );

  return (
    json.table?.rows ||
    []
  );

}

function getHeaderMap(
  cols
){

  const map = {};

  cols.forEach(
    (col,index) => {

      const label =
        String(
          col?.label ??
          ""
        ).trim();

      if(label)
        map[label.toLowerCase()] =
          index;

    }
  );

  return map;

}

function parseRegionTemperature(cells, headerMap){

  const tempColumn = headerMap["temperatur"];

  if(tempColumn !== undefined){
    const values = parseTemperatureValues(
      cells[tempColumn]?.f ??
      cells[tempColumn]?.v
    );

    if(Array.isArray(values) && values.length > 0){
      const value = values[0];
      return {min:value, max:value};
    }

    return null;
  }

  const minColumn = headerMap["temperatur von"];
  const maxColumn = headerMap["temperatur bis"];

  if(minColumn !== undefined || maxColumn !== undefined){
    const minValues = parseTemperatureValues(
      cells[minColumn]?.f ??
      cells[minColumn]?.v
    );
    const maxValues = parseTemperatureValues(
      cells[maxColumn]?.f ??
      cells[maxColumn]?.v
    );

    const values = [
      ...(minValues || []),
      ...(maxValues || [])
    ].filter(Number.isFinite);

    if(values.length === 0) return null;

    const value = values.reduce((sum, item) => sum + item, 0) / values.length;
    return {min:value, max:value};
  }

  const oldColumns = [
    ["kalt",0.25],
    ["gemäßigt",0.50],
    ["heiß",0.75]
  ];

  let bestLabel = null;
  let bestScore = -Infinity;

  oldColumns.forEach(([name,temp]) => {
    const column = headerMap[name];
    if(column === undefined) return;

    const value = parseRegionScore(
      cells[column]?.f ??
      cells[column]?.v
    );

    if(value !== null && value > bestScore){
      bestScore = value;
      bestLabel = temp;
    }
  });

  return bestLabel === null
    ? null
    : {min:bestLabel, max:bestLabel};

}

function parseGoogleVisualizationResponse(text){

  const firstBrace = text.indexOf("{");
  const lastBrace = text.lastIndexOf("}");

  if(firstBrace < 0 || lastBrace < firstBrace){
    throw new Error("Ungültige Google-Sheets-Antwort");
  }

  return JSON.parse(
    text.slice(firstBrace, lastBrace + 1)
  );
}

function loadGoogleSheetJsonp(sheetName){

  return new Promise((resolve, reject) => {

    const callbackName =
      `__sheetCallback_${Date.now()}_${Math.random().toString(36).slice(2)}`;

    const script = document.createElement("script");
    const timeoutId = setTimeout(() => {
      cleanup();
      reject(new Error(`Google Sheets Timeout: ${sheetName}`));
    }, 15000);

    function cleanup(){
      clearTimeout(timeoutId);
      if(script.parentNode)
        script.parentNode.removeChild(script);
      try{
        delete window[callbackName];
      }catch(_error){
        window[callbackName] = undefined;
      }
    }

    window[callbackName] = data => {
      cleanup();
      if(!data || !data.table){
        reject(new Error(`Ungültige Google-Sheets-Antwort für ${sheetName}`));
        return;
      }
      resolve(data);
    };

    script.onerror = () => {
      cleanup();
      reject(new Error(`Google Sheets konnte nicht geladen werden: ${sheetName}`));
    };

    const url =
      `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?sheet=${encodeURIComponent(sheetName)}&tqx=${encodeURIComponent(`responseHandler:${callbackName}`)}`;

    script.src = url;
    document.head.appendChild(script);
  });

}

async function loadRegionPresets(){

  const presetSelect =
    document.getElementById(
      "presetRegionSelect"
    );

  const worldSelect =
    document.getElementById(
      "worldRegionSelect"
    );

  if(!presetSelect || !worldSelect)
    return;

  try{

    const json =
      await loadGoogleSheetJsonp(REGION_SHEET_NAME);

    const cols =
      json.table?.cols ||
      [];

    const rows =
      json.table?.rows ||
      [];

    const headerMap =
      getHeaderMap(
        cols
      );

    const regionColumn =
      headerMap["region"] ??
      0;

    regionPresets =
      rows.map(
        (row,index) => {

          const cells =
            row.c || [];

          const name =
            String(
              cells[regionColumn]?.f ??
              cells[regionColumn]?.v ??
              ""
            ).trim();

          if(!name)
            return null;

          const typeColumn =
            headerMap["typ"];

          const type =
            typeColumn === undefined
              ? ""
              : String(
                  cells[typeColumn]?.f ??
                  cells[typeColumn]?.v ??
                  ""
                ).trim();

          const preset = {
            name,
            type,
            habitats:{},
            temperature:null
          };

          HABITATS.forEach(
            habitat => {

              const column =
                headerMap[
                  habitat.label.toLowerCase()
                ];

              if(
                column === undefined
              ){

                preset.habitats[
                  habitat.label
                ] = null;

                return;

              }

              preset.habitats[
                habitat.label
              ] =
                parseRegionScore(
                  cells[column]?.f ??
                  cells[column]?.v
                );

            }
          );

          preset.temperature =
            parseRegionTemperature(
              cells,
              headerMap
            );

          return preset;

        }
      ).filter(Boolean);

    const presets =
      regionPresets
        .filter(
          region =>
            String(
              region.type || ""
            ).trim().toLowerCase() === "vorlage"
        )
        .sort(
          (a,b) =>
            a.name.localeCompare(
              b.name,
              "de",
              {
                sensitivity:"base",
                numeric:true
              }
            )
        );

    const worldRegions =
      regionPresets
        .filter(
          region =>
            String(
              region.type || ""
            ).trim().toLowerCase() === "region"
        )
        .sort(
          (a,b) =>
            a.name.localeCompare(
              b.name,
              "de",
              {
                sensitivity:"base",
                numeric:true
              }
            )
        );

    presetSelect.innerHTML =
      `<option value="">Vorlage wählen…</option>` +
      presets
        .map(
          region =>
            `<option value="${regionPresets.indexOf(region)}">${escapeHTML(region.name)}</option>`
        )
        .join("");

    worldSelect.innerHTML =
      `<option value="">Region wählen…</option>` +
      worldRegions
        .map(
          region =>
            `<option value="${regionPresets.indexOf(region)}">${escapeHTML(region.name)}</option>`
        )
        .join("");

  }catch(error){

    console.error(
      "Fehler beim Laden der Regionen:",
      error
    );

    presetSelect.innerHTML =
      `<option value="">Regionen nicht geladen</option>`;
    worldSelect.innerHTML =
      `<option value="">Regionen nicht geladen</option>`;

  }

}

function applyRegionPresetToEditor(
  preset
){

  if(!preset)
    return;

  regionWeights = {};

  HABITATS.forEach(
    habitat => {

      const value =
        preset.habitats[
          habitat.label
        ];

      if(
        value !== null &&
        value !== undefined &&
        Number(value) > 0
      ){

        regionWeights[
          habitat.label
        ] = Number(value);

      }

    }
  );

  const temperature =
    preset.temperature;

  if(
    temperature !== null &&
    temperature !== undefined
  ){

    if(
      typeof temperature === "object"
    ){

      const min = parseTemperatureScalar(temperature.min);
      const max = parseTemperatureScalar(temperature.max);
      const midpoint = Number.isFinite(min) && Number.isFinite(max)
        ? (min + max) / 2
        : (min ?? max ?? 0.50);

      selectedTemperatureMin = midpoint;
      selectedTemperatureMax = midpoint;

    }else{

      const value = parseTemperatureScalar(temperature);
      selectedTemperatureMin = value ?? 0.50;
      selectedTemperatureMax = value ?? 0.50;

    }

  }

  buildHabitatUI();
  updateTemperatureUI();

}

/* =========================================================
   SHEET LADEN
========================================================= */

async function loadSheet(){

  try{

    const json =
      await loadGoogleSheetJsonp(SHEET_NAME);


    monsters =
      (json.table.rows || [])
        .map(row => {

          const cells =
            row.c || [];


          const monster = {

            name:
              cells[0]?.v ?? "",


            link:
              getCellLink(
                cells[1]
              ),


            cr:
              parseCR(
                cells[2]?.f ??
                cells[2]?.v
              ),


            xp:
              parseNumber(
                cells[3]?.f ??
                cells[3]?.v
              ),


            unique:
              String(
                cells[4]?.f ??
                cells[4]?.v ??
                ""
              ).trim(),


            habitats:{},

            temperature:null

          };


          HABITATS.forEach(habitat => {

            const cell =
              cells[
                habitat.columnIndex
              ];


            monster.habitats[
              habitat.label
            ] =
              parseScore(
                cell?.f ??
                cell?.v
              );

          });


          const temperatureCell =
            cells[TEMPERATURE_COLUMN_INDEX];

          monster.temperature =
            parseTemperatureValues(
              temperatureCell?.f ??
              temperatureCell?.v
            );


          return monster;

        })
        .filter(
          monster => monster.name
        );


    buildHabitatUI();

    updateTemperatureUI();

    try{
      await loadRegionPresets();
    }catch(regionError){
      console.error("Regionen konnten nicht geladen werden:", regionError);
    }

    filterMonsters();


  }catch(error){

    console.error(
      "Fehler beim Laden der Monsterdaten:",
      error
    );


    document.getElementById(
      "tableBody"
    ).innerHTML = `
      <tr>
        <td colspan="7">
          Fehler beim Laden der Monsterdaten.<br>
          <small>${escapeHTML(error?.message || String(error))}</small>
        </td>
      </tr>
    `;

  }

}


/* =========================================================
   LINK
========================================================= */

function getCellLink(cell){

  if(!cell)
    return "";


  if(cell.u)
    return cell.u;

  if(cell.href)
    return cell.href;

  if(cell.link)
    return cell.link;


  const value =
    String(
      cell.v ?? ""
    ).trim();


  if(
    value.startsWith("http://") ||
    value.startsWith("https://")
  ){

    return value;

  }


  return "";

}


/* =========================================================
   ZAHLEN
========================================================= */

function parseNumber(value){

  if(
    value === undefined ||
    value === null ||
    value === ""
  ){

    return 0;

  }


  if(
    typeof value === "number"
  ){

    return value;

  }


  const text =
    String(value)
      .trim()
      .replace(/\./g,"")
      .replace(",", ".");


  return Number(text) || 0;

}


/* =========================================================
   CR
========================================================= */

function parseCR(value){

  if(
    value === undefined ||
    value === null ||
    value === ""
  ){

    return 0;

  }


  let text =
    String(value)
      .trim()
      .toLowerCase()
      .replace(/^cr\s*/,"");


  if(
    text.includes("/")
  ){

    const parts =
      text.split("/");


    const numerator =
      Number(
        parts[0].trim()
      );


    const denominator =
      Number(
        parts[1].trim()
      );


    if(
      !isNaN(numerator) &&
      !isNaN(denominator) &&
      denominator !== 0
    ){

      return numerator / denominator;

    }

  }


  const fractions = {
    "⅛":0.125,
    "¼":0.25,
    "½":0.5
  };


  if(
    Object.prototype.hasOwnProperty.call(
      fractions,
      text
    )
  ){

    return fractions[text];

  }


  const number =
    Number(
      text.replace(",",".")
    );


  return isNaN(number)
    ? 0
    : number;

}


/* =========================================================
   CR FORMAT
========================================================= */

function formatCR(value){

  if(
    value === undefined ||
    value === null ||
    isNaN(value)
  ){

    return "—";

  }


  if(value === 0)
    return "0";

  if(value === 0.125)
    return "1/8";

  if(value === 0.25)
    return "1/4";

  if(value === 0.5)
    return "1/2";


  return String(value);

}


/* =========================================================
   SCORE
========================================================= */

function normalizeScore01(value){

  if(value === undefined || value === null || value === ""){
    return null;
  }

  const raw = String(value)
    .trim()
    .replace(",", ".");

  if(!raw){
    return null;
  }

  const number = Number(raw);

  if(!Number.isFinite(number) || number < 0){
    return null;
  }

  /*
     Neues Primärformat: 0.00–1.00.
     Die Werte im Sheet werden unverändert als 0–1 gelesen.
     Werte außerhalb dieses Bereichs gelten als ungültig,
     damit das Tool keine Daten mehr eigenmächtig umskaliert.
  */
  if(number > 1){
    return null;
  }

  return Math.max(0, Math.min(1, number));
}


function parseRegionScore(value){

  if(
    value === undefined ||
    value === null ||
    value === ""
  ){
    return null;
  }

  const number = Number(
    String(value)
      .replace(",", ".")
      .trim()
  );

  /*
     Regionenblatt / Biome sind jetzt dauerhaft 0–1.
     Es findet KEINE automatische 0–5 -> 0–1 Umrechnung mehr statt.
     Werte außerhalb 0–1 werden als ungültig behandelt.
  */
  if(!Number.isFinite(number) || number < 0 || number > 1){
    return null;
  }

  return number;
}


function parseScore(value){
  return normalizeScore01(value);
}


function normalizeTemperature01(value){

  if(value === undefined || value === null || value === ""){
    return null;
  }

  const raw = String(value).trim();

  if(!raw) return null;

  const number = Number(raw.replace(",", "."));

  if(!Number.isFinite(number)) return null;

  /*
     Neue Temperatur-Schwerpunkt-Skala: 0–1.
     Semantische Anker:
       1 -> 0.00  Arktisch
       2 -> 0.20  Kalt
       3 -> 0.50  Gemäßigt
       4 -> 0.80  Heiß
       5 -> 1.00  Vulkanisch / extrem heiß
     Neue 0–1-Werte bleiben unverändert.
  */
  if(number > 1){
    const legacyMap = {
      1: 0.00,
      2: 0.20,
      3: 0.50,
      4: 0.80,
      5: 1.00
    };
    const rounded = Math.round(number * 100) / 100;
    if(Object.prototype.hasOwnProperty.call(legacyMap, rounded)){
      return legacyMap[rounded];
    }
    return Math.max(0, Math.min(1, (number - 1) / 4));
  }

  return Math.max(0, Math.min(1, number));
}

function parseTemperatureScalar(value){
  return normalizeTemperature01(value);
}

function parseTemperatureValues(value){

  if(value === undefined || value === null || value === ""){
    return null;
  }

  const raw = String(value).trim();
  if(!raw) return null;

  /*
     Temperatur ist jetzt ein einzelner Schwerpunkt auf 0–1.
     Alte Mehrfachangaben wie 2,3,4 werden auf die neue
     semantische 0–1-Skala übertragen und gemittelt: 2/3/4 -> 0.50.
     Neue Dezimalwerte wie 0.65 oder 0,65 bleiben Einzelwerte.
  */
  const newDecimalPattern = /^0?(?:[.,]\d+)?$/;
  const singleNewPattern = /^(?:0[.,]\d+|1(?:[.,]0+)?)$/;

  if(singleNewPattern.test(raw)){
    const value01 = normalizeTemperature01(raw);
    return value01 === null ? null : [Math.round(value01 * 100) / 100];
  }

  const oldValues = raw
    .split(/[;,]/)
    .map(item => Number(item.trim().replace(",", ".")))
    .filter(value => Number.isFinite(value) && value >= 1 && value <= 5)
    .map(value => Math.round(value));

  if(oldValues.length === 0){
    const value01 = normalizeTemperature01(raw);
    return value01 === null ? null : [Math.round(value01 * 100) / 100];
  }

  const legacyMap = {
    1: 0.00,
    2: 0.20,
    3: 0.50,
    4: 0.80,
    5: 1.00
  };

  const mappedValues = oldValues
    .map(value => legacyMap[value])
    .filter(value => Number.isFinite(value));

  const average01 = mappedValues.reduce((sum, value) => sum + value, 0) / mappedValues.length;

  return [Math.round(Math.max(0, Math.min(1, average01)) * 100) / 100];
}

const TEMPERATURE_LABELS = {
  0:"Arktisch",
  0.2:"Kalt",
  0.4:"Kühl",
  0.5:"Gemäßigt",
  0.6:"Warm-gemäßigt",
  0.8:"Heiß",

};

function getTemperatureLabel(value){
  const rounded = Math.round(Number(value) * 100) / 100;
  if(Object.prototype.hasOwnProperty.call(TEMPERATURE_LABELS, rounded)){
    return TEMPERATURE_LABELS[rounded];
  }

  if(rounded < 0.25) return "Arktisch–Kalt";
  if(rounded < 0.5) return "Kalt–Gemäßigt";
  if(rounded < 0.75) return "Gemäßigt–Heiß";
  return "Heiß–Vulkanisch";
}

function formatMonsterTemperatures(

){

function formatTemperatureRange(
  min,
  max
){

  if(min === null || max === null || min === undefined || max === undefined){
    return "—";
  }

  if(min === max){
    return `${Number(min).toFixed(2)} · ${getTemperatureLabel(min)}`;
  }

  return `${Number(min).toFixed(2)}–${Number(max).toFixed(2)} · ${getTemperatureLabel(min)}–${getTemperatureLabel(max)}`;

}

function temperaturePercent(
  value
){

  return Number(value) * 100;

}

function temperatureFromPointer(
  event
){

  const wrap =
    document.getElementById(
      "temperatureRange"
    );

  const rect =
    wrap.getBoundingClientRect();

  const x =
    Math.max(
      0,
      Math.min(
        rect.width,
        event.clientX - rect.left
      )
    );

  const percent =
    rect.width > 0 ? x / rect.width : 0;

  return Math.round(percent * 20) / 20;

}

function setTemperatureFromPointer(
  side,
  event
){

  const value =
    temperatureFromPointer(
      event
    );

  if(side === "min"){

    selectedTemperatureMin =
      Math.min(
        value,
        selectedTemperatureMax
      );

  }else{

    selectedTemperatureMax =
      Math.max(
        value,
        selectedTemperatureMin
      );

  }

  updateTemperatureUI();

}

function startTemperatureDrag(
  side,
  event
){

  event.preventDefault();
  event.stopPropagation();

  const onMove =
    moveEvent => {

      setTemperatureFromPointer(
        side,
        moveEvent
      );

    };

  const onUp =
    () => {

      window.removeEventListener(
        "pointermove",
        onMove
      );

      window.removeEventListener(
        "pointerup",
        onUp
      );

    };

  window.addEventListener(
    "pointermove",
    onMove
  );

  window.addEventListener(
    "pointerup",
    onUp
  );

  setTemperatureFromPointer(
    side,
    event
  );

}

function updateTemperatureUI(){

  const leftHandle =
    document.getElementById(
      "temperatureHandleLeft"
    );

  const rightHandle =
    document.getElementById(
      "temperatureHandleRight"
    );

  const activeTrack =
    document.getElementById(
      "temperatureTrackActive"
    );

  if(
    !leftHandle ||
    !rightHandle ||
    !activeTrack
  ){

    return;

  }

  if(
    selectedTemperatureMin >
    selectedTemperatureMax
  ){

    selectedTemperatureMax =
      selectedTemperatureMin;

  }

  const minPercent =
    temperaturePercent(
      selectedTemperatureMin
    );

  const maxPercent =
    temperaturePercent(
      selectedTemperatureMax
    );

  /*
     Die beiden Halbgriffe teilen sich bei gleichem Wert
     exakt dieselbe Position. Dadurch entsteht ein Kreis,
     aber die linke/rechte Hälfte bleibt separat greifbar.
  */

  const collapsed =
    selectedTemperatureMin ===
    selectedTemperatureMax;

  if(collapsed){

    /*
       Beide Griffe teilen sich genau einen Kreis:
       linke Hälfte = Minimum, rechte Hälfte = Maximum.
       Dadurch sind sie unabhängig greifbar, obwohl sie
       optisch wie ein einziger Punkt aussehen.
    */

    leftHandle.style.width =
      "9px";

    leftHandle.style.left =
      `calc(${minPercent}% - 9px)`;

    leftHandle.style.borderRight =
      "none";

    rightHandle.style.width =
      "9px";

    rightHandle.style.left =
      `${maxPercent}%`;

    rightHandle.style.borderLeft =
      "none";

  }else{

    leftHandle.style.width =
      "18px";

    leftHandle.style.left =
      `calc(${minPercent}% - 9px)`;

    leftHandle.style.borderRight =
      "2px solid #ddd";

    rightHandle.style.width =
      "18px";

    rightHandle.style.left =
      `calc(${maxPercent}% - 9px)`;

    rightHandle.style.borderLeft =
      "2px solid #ddd";

  }

  activeTrack.style.left =
    `${minPercent}%`;

  activeTrack.style.right =
    `${100 - maxPercent}%`;

  leftHandle.setAttribute(
    "aria-valuenow",
    selectedTemperatureMin
  );

  rightHandle.setAttribute(
    "aria-valuenow",
    selectedTemperatureMax
  );

  document.getElementById(
    "temperatureCurrentValue"
  ).textContent =
    formatTemperatureRange(
      selectedTemperatureMin,
      selectedTemperatureMax
    );

}

/* =========================================================
   MONSTER 2 – 0–1 HABITAT-BEWERTUNG
========================================================= */

/*
   Monster-Habitatprofil:
   0.00 = keine Eignung
   1.00 = maximale Eignung

   Regionsprofil:
   0.00 = Habitat nicht vorhanden
   1.00 = maximal prägend

   Die Auswertung ist vollständig neu aufgebaut:
   - Monsterwert = Qualität des passenden Habitats.
   - Regionswert = ausschließlich das Gewicht dieses Habitats.
   - Regionswert 0 wird ignoriert.
   - Monsterwert 0 ist ein echter Nulltreffer.
   - Zusätzliche Monster-Habitate erzeugen keinen Malus.
*/

function habitatMatch(regionValue, monsterValue){

  const difference = Math.abs(
    regionValue - monsterValue
  );

  /*
     Kleine Abweichungen bis ±0,10 bilden ein leichtes Plateau:
     sie werden kaum bestraft. Danach steigt die Strafe progressiv an.

     Richtwerte:
       0,00 -> 1,00
       0,05 -> 0,99
       0,10 -> 0,98
       0,20 -> ca. 0,82
       0,30 -> ca. 0,68
       0,40 -> ca. 0,57
       0,50 -> ca. 0,46
       0,75 -> ca. 0,19
       1,00 -> 0,00
  */

  if(difference <= 0.10){
    return 1 - difference * 0.20;
  }

  const normalized =
    (difference - 0.10) / 0.90;

  return Math.pow(
    Math.max(0, 1 - normalized),
    2.40
  );
}


function habitatMatch(regionValue, monsterValue){

  const difference = Math.abs(
    regionValue - monsterValue
  );

  /*
     Kleine Abweichungen bis ±0,10 bilden ein leichtes Plateau:
     sie werden kaum bestraft. Danach steigt die Strafe progressiv an.

     Richtwerte:
       0,00 -> 1,00
       0,05 -> 0,99
       0,10 -> 0,98
       0,20 -> ca. 0,82
       0,30 -> ca. 0,68
       0,40 -> ca. 0,57
       0,50 -> ca. 0,46
       0,75 -> ca. 0,19
       1,00 -> 0,00
  */

  if(difference <= 0.10){
    return 1 - difference * 0.20;
  }

  const normalized =
    (difference - 0.10) / 0.90;

  return Math.pow(

  );
}

function getHabitatScore(monster){

  /*
     0–1-HABITAT-BEWERTUNG

     Monsterwert = Eignung für das jeweilige Biom.
     Regionswert = Bedeutung des Bioms in der Region.

     Die Region gewichtet nur die für sie relevanten Biome.
     Die Übereinstimmung wird über eine progressive Distanzstrafe bewertet:
     kleine Unterschiede bis ±0,10 werden kaum bestraft, größere
     Unterschiede zunehmend stärker.

     Die bestehende kleine Spezialisierungsnuance bleibt erhalten.
  */

  let totalRegionWeight = 0;
  let weightedMatch = 0;
  let weightedRelevantMonster = 0;

  for(const habitat of HABITATS){

    const regionValue = Number(
      appliedRegionWeights[habitat.label]
    );

    if(!Number.isFinite(regionValue) || regionValue <= 0){
      continue;
    }

    const monsterValue = Number(
      monster.habitats[habitat.label]
    );

    const safeMonsterValue = Number.isFinite(monsterValue)
      ? Math.max(0, Math.min(1, monsterValue))
      : 0;

    const safeRegionValue =
      Math.max(0, Math.min(1, regionValue));

    const weight = safeRegionValue;

    if(weight <= 0){
      continue;
    }

    const match = habitatMatch(
      safeRegionValue,
      safeMonsterValue
    );

    totalRegionWeight += weight;
    weightedMatch += match * weight;
    weightedRelevantMonster += safeMonsterValue * weight;
  }

  if(totalRegionWeight <= 0){
    return null;
  }

  const baseScore =
    weightedMatch / totalRegionWeight;

  /* Kleine Spezialisierungsnuance, maximal +0,05. */
  const relevantAverage =
    weightedRelevantMonster / totalRegionWeight;

  let allHabitatSum = 0;
  let allHabitatCount = 0;

  for(const habitat of HABITATS){

    const value = Number(
      monster.habitats[habitat.label]
    );

    const safeValue = Number.isFinite(value)
      ? Math.max(0, Math.min(1, value))
      : 0;

    allHabitatSum += safeValue;
    allHabitatCount += 1;
  }

  const overallAverage = allHabitatCount > 0
    ? allHabitatSum / allHabitatCount
    : 0;

  const specialization = Math.max(
    0,
    Math.min(1, relevantAverage - overallAverage)
  );

  const specializationBonus =
    specialization * 0.05;

  return Math.min(
    1,
    baseScore + specializationBonus
  );
}

/* =========================================================
   KLIMA
========================================================= */

function temperatureMatch(regionValue, monsterValue){

  const difference = Math.abs(Number(regionValue) - Number(monsterValue));

  if(!Number.isFinite(difference)) return 0;

  /*
     Temperatur-Plateau:
     Bis ±0.10 bleibt der Match nahezu vollständig erhalten.
     Danach fällt die Übereinstimmung weich, aber deutlich ab.
     Exakte Übereinstimmung = 1.00
  */
  if(difference <= 0.10){
    return 1 - difference * 0.20;
  }

  const normalized = (difference - 0.10) / 0.90;

  return Math.pow(
    Math.max(0, 1 - normalized),
    2.40
  );
}

function getClimateScore(monster){

  const monsterTemperatures = monster.temperature;

  if(!Array.isArray(monsterTemperatures) || monsterTemperatures.length === 0){
    return null;
  }

  const regionCenter =
    (Number(appliedTemperatureMin) + Number(appliedTemperatureMax)) / 2;

  let bestScore = 0;

  for(const temperature of monsterTemperatures){
    const normalizedTemperature = normalizeTemperature01(temperature);
    if(normalizedTemperature === null) continue;

    bestScore = Math.max(
      bestScore,
      temperatureMatch(regionCenter, normalizedTemperature)
    );
  }

  return bestScore;
}

/* =========================================================
   GESAMT
========================================================= */

function calculateScores(monster){

  const habitat = getHabitatScore(monster);
  const climate = getClimateScore(monster);

  let total = null;

  if(habitat === null && climate === null){
    total = null;
  }else if(habitat === null){
    total = climate;
  }else if(climate === null){
    total = habitat;
  }else{
    total = habitat * (2 / 3) + climate * (1 / 3);
  }

  return { habitat, climate, total };
}


/* =========================================================
   SCORE FORMAT
========================================================= */

function formatScore(
  score
){

  if(
    score === null ||
    score === undefined
  ){

    return "—";

  }


  return score.toFixed(2);

}


/* =========================================================
   STERNE
========================================================= */

function getStars(score){

  if(score === null || score === undefined){
    return "—";
  }

  const rounded =
    Math.max(0, Math.min(5, Math.round(score * 5)));

  return "★".repeat(rounded) + "☆".repeat(5 - rounded);
}

function renderHabitatDetails(
  monster
){

  const details = [];

  Object.keys(appliedRegionWeights).forEach(habitat => {
    const regionScore = Number(appliedRegionWeights[habitat]);
    if(!Number.isFinite(regionScore) || regionScore <= 0) return;

    const monsterScore = Number(monster.habitats[habitat]);
    if(!Number.isFinite(monsterScore)) return;

    details.push(`
      <span class="score-detail-item">
        <span class="score-detail-name">${escapeHTML(habitat)}</span>
        <span>${monsterScore.toFixed(2)}</span>
        <span style="opacity:.55">R:${regionScore.toFixed(2)}</span>
      </span>
    `);
  });

  return details.join("");
}

function setDefaultSortAfterFilter(

){

  sortColumn =
    "total";

  sortDirection =

    (a,b) =>
      (b.total ?? -Infinity) -
      (a.total ?? -Infinity)
  );

}

function setAlphabeticalSort(
  filtered
){

  sortColumn =
    "name";

  sortDirection =
    "asc";

  return filtered.sort(
    (a,b) =>
      String(a.name || "").localeCompare(
        String(b.name || ""),
        "de",
        {
          sensitivity:"base",
          numeric:true
        }
      )
  );

}

function hasActiveFilters(){

  const searchValue =
    String(
      document.getElementById(
        "searchInput"
      )?.value || ""
    ).trim();

  const crMin =
    document.getElementById(
      "crMin"
    )?.value || "";

  const crMax =
    document.getElementById(
      "crMax"
    )?.value || "";

  const xpMin =
    document.getElementById(
      "xpMin"
    )?.value || "";

  const xpMax =
    document.getElementById(
      "xpMax"
    )?.value || "";

  const unique =
    document.getElementById(
      "uniqueToggle"
    )?.checked || false;

  const hasHabitats =
    Object.values(
      appliedRegionWeights
    ).some(
      value => Number(value) > 0
    );

  const tempChanged =
    appliedTemperatureMin !== 0.50 ||
    appliedTemperatureMax !== 0.50;

  return Boolean(
    searchValue ||
    crMin ||
    crMax ||
    xpMin ||
    xpMax ||
    unique ||
    hasHabitats ||
    tempChanged
  );

}

function filterMonsters(){

  const filteringIsActive =
    hasActiveFilters();

  if(filteringIsActive){

    /*
       Filter aktiv -> automatisch Gesamtwertung
       absteigend. Wichtig: Die Tabelle verwendet
       sortColumn/sortDirection, nicht die früheren
       currentSort*-Variablen.
    */
    sortColumn =
      "total";

    sortDirection =
      "desc";

    document
      .querySelectorAll(
        ".sort-arrow"
      )
      .forEach(
        arrow =>
          arrow.textContent = ""
      );

    const totalHeader =
      document.querySelector(
        '[data-sort="total"]'
      );

    if(totalHeader){

      totalHeader
        .querySelector(
          ".sort-arrow"
        )
        .textContent =
          "▼";

    }

  }else{

    sortColumn =
      "name";

    sortDirection =
      "asc";

    document
      .querySelectorAll(
        ".sort-arrow"
      )
      .forEach(
        arrow =>
          arrow.textContent = ""
      );

    const nameHeader =
      document.querySelector(
        '[data-sort="name"]'
      );

    if(nameHeader){

      nameHeader
        .querySelector(
          ".sort-arrow"
        )
        .textContent =
          "▲";

    }

  }


  const search =
    document
      .getElementById(
        "searchInput"
      )
      .value
      .toLowerCase()
      .trim();


  const crMinValue =
    document
      .getElementById(
        "crMin"
      )
      .value;


  const crMaxValue =
    document
      .getElementById(
        "crMax"
      )
      .value;


  const crMin =
    crMinValue === ""
      ? null
      : Number(
          crMinValue
        );


  const crMax =
    crMaxValue === ""
      ? null
      : Number(
          crMaxValue
        );


  const xpMin =
    parseFloat(
      document
        .getElementById(
          "xpMin"
        )
        .value
    );


  const xpMax =
    parseFloat(
      document
        .getElementById(
          "xpMax"
        )
        .value
    );


  const filtered = [];


  for(
    let i=0;
    i<monsters.length;
    i++
  ){

    const monster =
      monsters[i];


    if(
      !showUnique &&
      monster.unique === "Ja"
    ){

      continue;

    }


    if(
      crMin !== null &&
      monster.cr < crMin
    ){

      continue;

    }


    if(
      crMax !== null &&
      monster.cr > crMax
    ){

      continue;

    }


    if(
      !isNaN(xpMin) &&
      monster.xp < xpMin
    ){

      continue;

    }


    if(
      !isNaN(xpMax) &&
      monster.xp > xpMax
    ){

      continue;

    }


    if(
      search &&
      !monster.name
        .toLowerCase()
        .includes(
          search
        )
    ){

      continue;

    }


    const scores =
      calculateScores(
        monster
      );


    filtered.push({

      monster,

      index:i,

      total:
        scores.total,

      habitat:
        scores.habitat,

      climate:
        scores.climate

    });

  }


  filtered.sort(
    (a,b)=>{

      let x;
      let y;


      switch(
        sortColumn
      ){

        case "cr":

          x =
            a.monster.cr;

          y =
            b.monster.cr;

          break;


        case "xp":

          x =
            a.monster.xp;

          y =
            b.monster.xp;

          break;


        case "total":

          x =
            a.total;

          y =
            b.total;

          break;


        case "habitat":

          x =
            a.habitat;

          y =
            b.habitat;

          break;


        case "climate":

          x =
            a.climate;

          y =
            b.climate;

          break;


        default:

          x =
            a.monster.name;

          y =
            b.monster.name;

      }


      if(
        x === null ||
        x === undefined
      ){

        x = -1;

      }


      if(
        y === null ||
        y === undefined
      ){

        y = -1;

      }


      if(
        typeof x === "string"
      ){

        x =
          x.toLowerCase();

        y =
          y.toLowerCase();

      }


      if(x < y){

        return sortDirection === "asc"
          ? -1
          : 1;

      }


      if(x > y){

        return sortDirection === "asc"
          ? 1
          : -1;

      }


      return 0;

    }
  );


  if(
    window.innerWidth <= 700
  ){

    renderMobileCards(
      filtered
    );

  }else{

    renderTable(
      filtered
    );

  }


  document
    .getElementById(
      "resultCount"
    )
    .textContent =
      filtered.length;

}

/* =========================================================
   ESCAPE
========================================================= */

function escapeHTML(
  value
){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeAttribute(
  value
){

  return escapeHTML(value);

}

let editMonsterIndex = null;

function buildEditGrid(){
  const container = document.getElementById("biomeEditGrid");
  container.innerHTML = "";
  HABITATS.forEach(h => {
    const div = document.createElement("div");
    div.className = "biome-edit-item";
    div.innerHTML = `
      <label for="edit_${h.label}">${escapeHTML(h.label)}</label>
      <input id="edit_${h.label}" type="number" min="0" max="1" step="0.05" value="0">
    `;
    container.appendChild(div);
  });
}

function openEditModal(index){
  const monster = monsters[index];
  if(!monster) return;
  editMonsterIndex = index;
  document.getElementById("editModalTitle").textContent = monster.name;
  document.getElementById("editModalSubtitle").textContent = "Habitatwerte 0,0–1,0 · Temperatur 0,0–1,0";
  HABITATS.forEach(h => {
    const input = document.getElementById(`edit_${h.label}`);
    if(input) input.value = Number(monster.habitats[h.label] || 0).toFixed(1);
  });
  const temp = Array.isArray(monster.temperature) && monster.temperature.length ? Number(monster.temperature[0]) : 0.50;
  document.getElementById("editTemperature").value = Number(temp).toFixed(2);
  document.getElementById("editStatus").textContent = "";
  document.getElementById("editModal").classList.add("open");
}

function closeEditModal(){
  document.getElementById("editModal").classList.remove("open");
  editMonsterIndex = null;
}

function getEditedValues(){
  const habitats = {};
  HABITATS.forEach(h => {
    const input = document.getElementById(`edit_${h.label}`);
    let value = Number(input?.value ?? 0);
    if(!Number.isFinite(value)) value = 0;
    habitats[h.label] = Math.max(0, Math.min(1, Math.round(value*10)/10));
  });
  let temperature = Number(document.getElementById("editTemperature").value);
  if(!Number.isFinite(temperature)) temperature = 0.50;
  temperature = Math.max(0, Math.min(1, Math.round(temperature * 20) / 20));
  return { habitats, temperature };
}

function applyEditedValuesToMonster(){
  if(editMonsterIndex === null) return null;
  const monster = monsters[editMonsterIndex];
  if(!monster) return null;
  const edited = getEditedValues();
  monster.habitats = edited.habitats;
  monster.temperature = [edited.temperature];
  filterMonsters();
  return edited;
}

function writeMonsterToSheet(){
  const status = document.getElementById("editStatus");
  if(editMonsterIndex === null) return;
  const monster = monsters[editMonsterIndex];
  if(!monster) return;

  if(!SHEET_WRITE_URL){
    status.textContent = "Noch keine Schreib-URL hinterlegt.";
    return;
  }

  const edited = getEditedValues();
  const callbackName = "sheetWriteCallback_" + Date.now() + "_" + Math.floor(Math.random() * 100000);

  window[callbackName] = function(result){
    try{
      if(result && result.ok){
        applyEditedValuesToMonster();
        status.textContent = "✓ Ins Google Sheet geschrieben.";
      }else{
        status.textContent = "Fehler beim Schreiben: " + (result && result.error ? result.error : "Unbekannter Fehler");
      }
    }finally{
      delete window[callbackName];
      if(script && script.parentNode){
        script.parentNode.removeChild(script);
      }
    }
  };

  const params = new URLSearchParams({
    action: "updateMonster",
    sheetId: SHEET_ID,
    sheetName: SHEET_NAME,
    monsterName: monster.name,
    habitats: JSON.stringify(edited.habitats),
    temperature: Number(edited.temperature).toFixed(2),
    callback: callbackName
  });

  const script = document.createElement("script");
  script.async = true;
  script.onerror = function(){
    delete window[callbackName];
    status.textContent = "Fehler: Google Apps Script ist nicht erreichbar oder nicht öffentlich bereitgestellt.";
    if(script.parentNode){
      script.parentNode.removeChild(script);
    }
  };

  status.textContent = "Schreibe ins Google Sheet…";
  script.src = `${SHEET_WRITE_URL}?${params.toString()}`;
  document.head.appendChild(script);
}

buildEditGrid();
document.addEventListener("click", event => {
  const button = event.target.closest(".edit-monster-button");
  if(button) openEditModal(Number(button.dataset.monsterIndex));
});

document.getElementById("editModalClose").addEventListener("click", closeEditModal);
document.getElementById("editSaveLocal").addEventListener("click", () => {

  document.getElementById("editStatus").textContent = "Werte im Tool übernommen.";
});
document.getElementById("editSaveSheet").addEventListener("click", writeMonsterToSheet);
document.getElementById("editModal").addEventListener("click", event => {
  if(event.target.id === "editModal") closeEditModal();
});

let currentView = "monsters";

function setModeView(view){
  currentView = view === "regions" ? "regions" : "monsters";
  const monsterTableSection = document.querySelector(".table-section");
  const sidebar = document.querySelector(".sidebar");
  const regionView = document.getElementById("regionEditorView");
  const tabs = document.querySelectorAll(".mode-tab");
  const toggleButtons = document.querySelectorAll(".toggle-sidebar");
  const container = document.querySelector(".container");
  tabs.forEach(tab => tab.classList.toggle("active", tab.dataset.view === currentView));
  const regionMode = currentView === "regions";
  if(monsterTableSection) monsterTableSection.style.display = regionMode ? "none" : "";
  if(sidebar) sidebar.style.display = regionMode ? "none" : "";
  if(regionView) regionView.classList.toggle("open", regionMode);
  toggleButtons.forEach(btn => btn.style.display = regionMode ? "none" : "");
  if(container) container.classList.toggle("region-mode", regionMode);
  if(regionMode) populateRegionEditorSelects();
}

document.querySelectorAll(".mode-tab").forEach(tab => {
  tab.addEventListener("click", () => setModeView(tab.dataset.view));
});

function buildMonsterEditorControls(monster){
  const wrap = document.createElement("div");

  grid.className = "editor-slider-grid";
  HABITATS.forEach(h => {
    const item = document.createElement("div");
    item.className = "editor-slider-item";
    const safe = Number.isFinite(Number(monster.habitats[h.label])) ? Number(monster.habitats[h.label]) : 0;
    item.innerHTML = `
      <div class="editor-slider-head">
        <label>${escapeHTML(h.label)}</label>
        <output>${safe.toFixed(2)}</output>

      <input class="monster-edit-range" data-habitat="${escapeAttribute(h.label)}" type="range" min="0" max="1" step="0.05" value="${safe.toFixed(2)}">

    const output = item.querySelector("output");

  const actions = document.createElement("div");

    <button type="button" id="monsterSaveSheet" style="background:#4f46e5;border-color:#6d63ff">In Sheet speichern</button>

  wrap.appendChild(actions);
  return wrap;
}

function populateRegionEditorSelects(){
  const typeSelect = document.getElementById("regionEditorType");
  const select = document.getElementById("regionEditorSelect");
  if(!typeSelect || !select) return;
  const wantType = typeSelect.value;
  const list = regionPresets
    .map((r, i) => ({...r, _index:i}))
    .filter(r => String(r.type || "").trim().toLowerCase() === wantType);
  select.innerHTML = '<option value="">Region auswählen…</option>' + list
    .map(r => `<option value="${r._index}">${escapeHTML(r.name)}</option>`).join("");
}

function buildRegionEditorGrid(){
  const grid = document.getElementById("regionEditorGrid");
  if(!grid) return;
  grid.innerHTML = "";
  HABITATS.forEach(h => {
    const item = document.createElement("div");
    item.className = "region-editor-item";
    item.innerHTML = `
      <div class="region-editor-item-head"><label>${escapeHTML(h.label)}</label><output data-region-output="${escapeAttribute(h.label)}">0.00</output></div>
      <input data-region-range="${escapeAttribute(h.label)}" type="range" min="0" max="1" step="0.05" value="0">
    `;
    const input = item.querySelector("input");
    const output = item.querySelector("output");
    input.addEventListener("input", () => output.value = Number(input.value).toFixed(2));
    grid.appendChild(item);
  });
  const temp = document.getElementById("regionEditorTemperature");
  const out = document.getElementById("regionEditorTemperatureValue");
  if(temp && out) temp.addEventListener("input", () => out.value = temp.value);
}

function loadRegionEditor(index){
  if(index === "" || index === null || index === undefined) return;
  const region = regionPresets[Number(index)];
  if(!region) return;
  selectedRegionEditorIndex = Number(index);
  HABITATS.forEach(h => {
    const input = document.querySelector(`[data-region-range="${CSS.escape(h.label)}"]`);
    const output = document.querySelector(`[data-region-output="${CSS.escape(h.label)}"]`);
    const value = Number(region.habitats[h.label]);
    const safe = Number.isFinite(value) ? Math.max(0, Math.min(1, value)) : 0;
    if(input) input.value = safe.toFixed(2);
    if(output) output.value = safe.toFixed(2);
  });
  let temp = 0.50;
  if(typeof region.temperature === "object" && region.temperature){ temp = Number(region.temperature.min); }
  else if(Number.isFinite(Number(region.temperature))) temp = Number(region.temperature);
  temp = Number.isFinite(temp) ? Math.max(0, Math.min(1, Math.round(temp * 20) / 20)) : 0.50;
  const tempInput = document.getElementById("regionEditorTemperature");
  const tempOut = document.getElementById("regionEditorTemperatureValue");
  if(tempInput) tempInput.value = String(temp);
  if(tempOut) tempOut.value = String(temp);
  document.getElementById("regionEditorStatus").textContent = `Bearbeite: ${region.name}`;
}

function getRegionEditorValues(){
  const habitats = {};
  HABITATS.forEach(h => {
    const input = document.querySelector(`[data-region-range="${CSS.escape(h.label)}"]`);
    habitats[h.label] = Math.max(0, Math.min(1, Math.round(Number(input?.value || 0)*20)/20));
  });
  const temp = Math.max(0, Math.min(1, Math.round(Number(document.getElementById("regionEditorTemperature")?.value ?? 0.50) * 20) / 20));
  return {habitats, temperature:temp};
}

function applyRegionEditorLocal(){
  if(selectedRegionEditorIndex === null) return null;
  const region = regionPresets[selectedRegionEditorIndex];
  if(!region) return null;
  const edited = getRegionEditorValues();
  region.habitats = {...edited.habitats};
  region.temperature = {min:edited.temperature, max:edited.temperature};
  regionWeights = {...edited.habitats};
  selectedTemperatureMin = edited.temperature;
  selectedTemperatureMax = edited.temperature;
  appliedRegionWeights = {...regionWeights};
  appliedTemperatureMin = edited.temperature;
  appliedTemperatureMax = edited.temperature;
  buildHabitatUI();
  updateTemperatureUI();
  filterMonsters();
  return edited;
}

function writeRegionToSheet(){
  const status = document.getElementById("regionEditorStatus");
  if(selectedRegionEditorIndex === null){ status.textContent = "Bitte zuerst eine Region auswählen."; return; }
  const region = regionPresets[selectedRegionEditorIndex];
  if(!region) return;
  const edited = getRegionEditorValues();
  if(!SHEET_WRITE_URL){ status.textContent = "Schreib-URL fehlt."; return; }
  const callbackName = "regionWriteCallback_" + Date.now() + "_" + Math.floor(Math.random()*100000);
  let script = null;
  window[callbackName] = function(result){
    try{
      if(result && result.ok){
        applyRegionEditorLocal();
        status.textContent = `✓ ${region.name} im Google Sheet gespeichert.`;
      }else{
        status.textContent = "Fehler: " + (result?.error || "Unbekannter Fehler");
      }
    }finally{
      delete window[callbackName];
      if(script?.parentNode) script.parentNode.removeChild(script);
    }
  };
  const params = new URLSearchParams({
    action:"updateRegion", sheetId:SHEET_ID, sheetName:REGION_SHEET_NAME,
    regionName:region.name, habitats:JSON.stringify(edited.habitats),
    temperature:Number(edited.temperature).toFixed(2), callback:callbackName
  });
  script = document.createElement("script");
  script.src = `${SHEET_WRITE_URL}?${params.toString()}`;
  script.onerror = () => {
    delete window[callbackName];
    status.textContent = "Fehler: Web-App nicht erreichbar.";
    if(script?.parentNode) script.parentNode.removeChild(script);
  };
  status.textContent = "Speichere…";
  document.head.appendChild(script);
}

function getSidebarSelectedRegionIndex(){
  const preset = document.getElementById("presetRegionSelect");
  const world = document.getElementById("worldRegionSelect");
  const value = (world && world.value) || (preset && preset.value) || "";
  if(value === "") return null;
  const index = Number(value);
  return Number.isInteger(index) && regionPresets[index] ? index : null;
}

function writeSidebarRegionToSheet(){
  const status = document.getElementById("sidebarRegionSaveStatus");
  const index = getSidebarSelectedRegionIndex();
  if(!status) return;
  if(index === null){
    status.textContent = "Bitte zuerst eine Vorlage oder Region auswählen.";
    return;
  }
  if(!SHEET_WRITE_URL){
    status.textContent = "Schreib-URL fehlt.";
    return;
  }
  const region = regionPresets[index];
  const habitats = {};
  HABITATS.forEach(h => {
    const value = Number(regionWeights[h.label] ?? 0);
    habitats[h.label] = Math.max(0, Math.min(1, Math.round(value * 20) / 20));
  });
  const temp = Math.max(0, Math.min(1, Math.round(Number(selectedTemperatureMin ?? 0.50) * 20) / 20));
  const callbackName = "sidebarRegionWrite_" + Date.now() + "_" + Math.floor(Math.random()*100000);

  window[callbackName] = function(result){
    try{
      if(result && result.ok){
        region.habitats = {...habitats};
        region.temperature = {min:temp,max:temp};
        appliedRegionWeights = {...habitats};
        appliedTemperatureMin = temp;
        appliedTemperatureMax = temp;
        status.textContent = `✓ ${region.name} im Google Sheet gespeichert.`;
        filterMonsters();
      }else{
        status.textContent = "Fehler: " + (result?.error || "Unbekannter Fehler");
      }
    }finally{
      delete window[callbackName];
      if(script?.parentNode) script.parentNode.removeChild(script);
    }
  };
  const params = new URLSearchParams({
    action:"updateRegion",
    sheetId:SHEET_ID,
    sheetName:REGION_SHEET_NAME,
    regionName:region.name,
    habitats:JSON.stringify(habitats),
    temperature:String(temp),
    callback:callbackName
  });
  script = document.createElement("script");
  script.async = true;
  script.src = `${SHEET_WRITE_URL}?${params.toString()}`;
  script.onerror = () => {
    delete window[callbackName];
    status.textContent = "Fehler: Web-App nicht erreichbar.";
    if(script?.parentNode) script.parentNode.removeChild(script);
  };
  status.textContent = "Speichere…";
  document.head.appendChild(script);
}

buildRegionEditorGrid();
