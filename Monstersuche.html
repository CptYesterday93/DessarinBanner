<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>DnD Monster Database – V13</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">

<style>

*{
  box-sizing:border-box;
}

html,
body{
  height:100%;
}

body{
  margin:0;
  background:#181818;
  color:white;
  font-family:Arial,sans-serif;
  overflow:hidden;
}

.container{
  display:grid;
  grid-template-columns:minmax(0,1fr) 340px;
  gap:20px;
  padding:20px;
  height:100vh;
  align-items:start;
  transition:grid-template-columns .25s ease;
}

.container.sidebar-collapsed{
  grid-template-columns:minmax(0,1fr) 0px;
}

.table-section{
  min-width:0;
  height:calc(100vh - 40px);
  overflow:auto;
  border-radius:16px;
}

.sidebar{
  background:#242424;
  border-radius:16px;
  padding:22px;
  position:sticky;
  top:20px;
  height:calc(100vh - 40px);
  overflow:auto;
  border:1px solid #3a3a3a;

  transition:
    transform .25s ease,
    opacity .25s ease;
}

.container.sidebar-collapsed .sidebar{
  opacity:0;
  pointer-events:none;
  overflow:hidden;
}

h1,
h2,
h3{
  font-family:"Cinzel",serif;
}

.topbar{
  margin-bottom:16px;
}

input,
select,
button{
  width:100%;
  padding:11px;
  border-radius:10px;
  border:1px solid #444;
  background:#1d1d1d;
  color:white;
  font-size:15px;
}

button{
  cursor:pointer;
}

select{
  cursor:pointer;
}

input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button{
  -webkit-appearance:none;
  margin:0;
}

input[type="number"]{
  -moz-appearance:textfield;
  appearance:textfield;
}

.filter-group{
  margin-bottom:20px;
}

.filter-group > label{
  display:block;
  margin-bottom:8px;
  font-weight:bold;
}

.range-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

/* =========================================================
   SCHNELLBUTTON
========================================================= */

.quick-action{
  display:inline-block;
  width:auto;

  padding:4px 8px;
  margin-bottom:8px;

  border:1px solid #444;
  border-radius:7px;

  background:#292929;
  color:#aaa;

  font-size:12px;
  line-height:1;
}

.quick-action:hover{
  background:#333;
  color:#ddd;
}

/* =========================================================
   EINZIGARTIGE
========================================================= */

.unique-toggle{
  display:flex;
  align-items:center;
  gap:9px;

  width:max-content;

  padding:7px 10px;

  border:1px solid #444;
  border-radius:8px;

  background:#292929;
  color:#aaa;

  font-size:13px;
}

.unique-toggle:hover{
  background:#333;
  color:#ddd;
}

.unique-toggle-indicator{
  width:14px;
  height:14px;

  border:1px solid #666;
  border-radius:4px;

  background:#1d1d1d;

  transition:
    background .15s ease,
    border-color .15s ease;
}

.unique-toggle.active{
  color:white;
}

.unique-toggle.active
.unique-toggle-indicator{
  background:#4f46e5;
  border-color:#7c74ff;
}

/* =========================================================
   KLIMA
========================================================= */

.climate-select{
  display:flex;
  gap:8px;
}

.climate-select button{
  width:auto;
  flex:1;

  background:#333;
  padding:10px 12px;
}

.climate-select button.active{
  background:#4f46e5;
  border-color:#7c74ff;
}

/* =========================================================
   REGIONSPROFIL
========================================================= */

.region-profiles{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.region-row{
  display:flex;
  align-items:center;
  gap:8px;

  padding:7px 8px;

  background:#292929;
  border:1px solid #3b3b3b;
  border-radius:8px;
}

.region-name{
  flex:1;
  font-size:14px;
}

.region-stars{
  display:flex;
  gap:1px;
}

.region-star{
  width:auto;
  padding:0;

  border:none;
  background:transparent;

  color:#555;

  font-size:17px;
  line-height:1;

  cursor:pointer;
}

.region-star:hover{
  color:#aaa;
}

.region-star.active{
  color:#f0c75e;
}

.region-select{
  width:auto;

  padding:5px 8px;

  font-size:12px;
  background:#333;
}

.region-remove{
  width:26px;

  padding:4px;

  background:transparent;

  border:none;
  color:#888;

  font-size:16px;
}

/* =========================================================
   TABELLE
========================================================= */

table{
  width:100%;
  border-collapse:separate;
  border-spacing:0;
  background:#222;
  border-radius:14px;
  overflow:visible;
}

th,
td{
  padding:12px;
  text-align:left;
  vertical-align:top;

  border-bottom:1px solid #3f3f3f;
  border-right:1px solid rgba(255,255,255,.06);

  box-shadow:
    inset -1px 0 0 rgba(255,255,255,.03);
}

th:last-child,
td:last-child{
  border-right:none;
}

th{
  background:#303030;
  position:sticky;
  top:0;
  z-index:50;

  box-shadow:
    0 2px 10px rgba(0,0,0,.35);
}

.sortable{
  cursor:pointer;
  user-select:none;
}

.sortable:hover{
  background:#3b3b3b;
}

.sort-arrow{
  margin-left:6px;
  font-size:12px;
  opacity:.8;
}

tbody tr:nth-child(even){
  background:#242424;
}

tbody tr:nth-child(odd){
  background:#2c2c2c;
}

tbody tr{
  transition:
    background .18s ease,
    box-shadow .18s ease;
}

tbody tr:hover{
  background:#353535;

  box-shadow:
    inset 3px 0 0 #6d63ff,
    inset 0 0 0 1px rgba(255,255,255,.04);
}

/* =========================================================
   MONSTERNAME
========================================================= */

.monster-cell{
  display:flex;
  align-items:center;
  gap:8px;
  min-width:220px;
}

.monster-link{
  color:#8ecbff;
  text-decoration:none;
  font-weight:bold;
}

.monster-link:hover{
  text-decoration:underline;
}

.info-button{
  width:auto;

  padding:4px 7px;

  background:#333;
  border:1px solid #4a4a4a;

  border-radius:6px;

  color:#aaa;

  font-size:11px;
  line-height:1;
}

.info-button:hover{
  background:#444;
  color:white;
}

/* =========================================================
   WERTE
========================================================= */

.unique-yes{
  color:#ff9b42;
  font-weight:bold;
}

.unique-no{
  color:#aaa;
}

.score{
  font-weight:bold;
  white-space:nowrap;
}

.score-total{
  font-size:16px;
}

.score-detail{
  margin-top:6px;

  display:flex;
  flex-wrap:wrap;
  gap:5px 12px;

  font-size:12px;
  line-height:1.35;

  color:#d5d5d5;
}

.score-detail-item{
  white-space:nowrap;
}

.score-detail-name{
  opacity:.85;
  margin-right:4px;
}

.score-detail-stars{
  letter-spacing:1px;
}

/* =========================================================
   SUCHE
========================================================= */

.search-row{
  display:flex;
  gap:8px;
}

.search-row input{
  flex:1;
}

.search-row button{
  width:auto;
  padding:0 14px;

  background:#383838;
  border:1px solid #555;

  font-weight:bold;
}

/* =========================================================
   SIDEBAR TOGGLE
========================================================= */

.toggle-sidebar{
  display:none;

  position:fixed;
  top:16px;
  right:16px;

  z-index:10000;

  width:auto;

  padding:12px 16px;

  border:none;
  border-radius:12px;

  background:#4f46e5;
  color:white;

  font-weight:bold;
}

.desktop-toggle{
  display:block;
}

/* =========================================================
   MOBILE
========================================================= */

.mobile-cards{
  display:none;
}

.mobile-card{
  background:#242424;
  border:1px solid #3f3f3f;
  border-radius:16px;
  padding:16px;
  margin-bottom:14px;
}

.mobile-card-title{
  font-size:18px;
  font-weight:bold;
  margin-bottom:12px;

  display:flex;
  align-items:center;
  gap:8px;
}

.mobile-card-title a{
  color:#8ecbff;
  text-decoration:none;
}

.mobile-card-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.mobile-label{
  font-size:12px;
  opacity:.7;
}

.mobile-value{
  font-size:14px;
}

.mobile-score{
  font-size:18px;
  font-weight:bold;
}

.mobile-detail-list{
  grid-column:1 / -1;

  font-size:13px;
  line-height:1.5;
}

/* =========================================================
   MODAL
========================================================= */

.modal-backdrop{
  position:fixed;
  inset:0;

  background:rgba(0,0,0,.7);

  display:none;
  align-items:center;
  justify-content:center;

  z-index:20000;

  padding:20px;
}

.modal-backdrop.open{
  display:flex;
}

.modal{
  width:min(760px,100%);

  max-height:90vh;
  overflow:auto;

  background:#242424;

  border:1px solid #444;
  border-radius:16px;

  box-shadow:
    0 12px 40px rgba(0,0,0,.5);
}

.modal-header{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:20px;

  padding:20px 22px;

  border-bottom:1px solid #3f3f3f;
}

.modal-title{
  margin:0;
  font-size:24px;
}

.modal-close{
  width:auto;

  padding:6px 10px;

  background:#333;
  border:1px solid #4a4a4a;

  font-size:18px;
}

.modal-body{
  padding:22px;
}

.modal-meta{
  display:flex;
  flex-wrap:wrap;
  gap:10px 20px;

  margin-bottom:22px;

  color:#ccc;
}

.modal-section{
  margin-bottom:22px;
}

.modal-section h3{
  margin:0 0 12px 0;
}

.profile-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.profile-item{
  padding:9px 10px;

  background:#2c2c2c;

  border:1px solid #3d3d3d;
  border-radius:8px;

  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.profile-item-name{
  color:#ddd;
}

.profile-item-score{
  white-space:nowrap;
  color:#f0c75e;
  letter-spacing:1px;
}

.modal-link{
  display:inline-block;

  padding:9px 12px;

  background:#4f46e5;

  border-radius:8px;

  color:white;
  text-decoration:none;
  font-weight:bold;
}

.modal-link:hover{
  background:#5b52ef;
}

/* =========================================================
   SCROLL TOP
========================================================= */

#scrollTopBtn{
  position:fixed;
  bottom:20px;
  right:20px;

  width:54px;
  height:54px;

  border:none;
  border-radius:50%;

  background:#4f46e5;
  color:white;

  font-size:24px;
  font-weight:bold;

  cursor:pointer;

  z-index:10001;

  opacity:0;
  pointer-events:none;

  transition:
    opacity .2s ease,
    transform .2s ease;

  box-shadow:
    0 4px 12px rgba(0,0,0,.35);
}

#scrollTopBtn.show{
  opacity:1;
  pointer-events:auto;
}

#scrollTopBtn:hover{
  transform:translateY(-2px);
}

/* =========================================================
   MOBILE MEDIA
========================================================= */

@media (max-width:700px){

  body{
    overflow:auto;
  }

  .container{
    display:flex !important;
    flex-direction:column !important;
    padding:14px;
    height:auto;
  }

  .table-section{
    height:auto;
    max-height:none;
    overflow:visible;
  }

  .sidebar{
    order:-1;

    position:fixed;

    left:0;
    top:0;

    width:100%;
    max-width:100%;
    height:100vh;

    overflow-y:auto;

    z-index:9999;

    border-radius:0;

    transform:translateX(100%);

    transition:transform .25s ease;
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .toggle-sidebar{
    display:block;
  }

  .desktop-toggle{
    display:none;
  }

  .table-section table{
    display:none !important;
  }

  thead,
  tbody{
    display:none !important;
  }

  .mobile-cards{
    display:block;
  }

  h1{
    font-size:28px;
    line-height:1.2;
    margin-right:90px;
  }

  .profile-grid{
    grid-template-columns:1fr;
  }

}

</style>
</head>

<script>

/* =========================================================
   GOOGLE SHEET
========================================================= */

const SHEET_ID =
  "1v7egXu70tpq7mkPCmZq4ak7fMu3NzZYPR1Rd2mLx8_0";

const SHEET_NAME =
  "Sheet1";


/* =========================================================
   SPALTEN
   A = Monster
   B = DDB Link
   C = CR
   D = XP
   E = Einzigartig?
   F = Wald
   G = Grasland
   H = Wüste
   I = Sumpf
   J = Gebirge
   K = Küste
   L = Fluss/See
   M = Meer
   N = Höhle
   O = Untergrund
   P = Ruinen
   Q = Siedlung
   R = Kalt
   S = Gemäßigt
   T = Heiß
========================================================= */


/* =========================================================
   HABITATE
========================================================= */

const HABITATS = [

  {
    label:"Wald",
    columnIndex:5
  },

  {
    label:"Grasland",
    columnIndex:6
  },

  {
    label:"Wüste",
    columnIndex:7
  },

  {
    label:"Sumpf",
    columnIndex:8
  },

  {
    label:"Gebirge",
    columnIndex:9
  },

  {
    label:"Küste",
    columnIndex:10
  },

  {
    label:"Fluss/See",
    columnIndex:11
  },

  {
    label:"Meer",
    columnIndex:12
  },

  {
    label:"Höhle",
    columnIndex:13
  },

  {
    label:"Untergrund",
    columnIndex:14
  },

  {
    label:"Ruinen",
    columnIndex:15
  },

  {
    label:"Siedlung",
    columnIndex:16
  }

];


/* =========================================================
   KLIMA
========================================================= */

const CLIMATES = [

  {
    label:"Kalt",
    columnIndex:17
  },

  {
    label:"Gemäßigt",
    columnIndex:18
  },

  {
    label:"Heiß",
    columnIndex:19
  }

];


/* =========================================================
   CR
========================================================= */

const CR_VALUES = [

  {
    label:"Alle",
    value:null
  },

  {
    label:"0",
    value:0
  },

  {
    label:"1/8",
    value:0.125
  },

  {
    label:"1/4",
    value:0.25
  },

  {
    label:"1/2",
    value:0.5
  }

];

for(
  let i = 1;
  i <= 30;
  i++
){

  CR_VALUES.push({
    label:String(i),
    value:i
  });

}


/* =========================================================
   STATE
========================================================= */

let monsters = [];


/*
 * Beispiel:
 *
 * Wald: 5
 * Fluss/See: 2
 * Gebirge: 3
 *
 * Nur diese ausgewählten Lebensräume
 * fließen in den Lebensraum-Score ein.
 */

let regionWeights = {};


/*
 * Genau ein Klima.
 */

let selectedClimate =
  "Gemäßigt";


/*
 * False = nur normale Monster
 * True = normale + einzigartige Monster
 */

let showUnique =
  false;


let sortColumn =
  "name";

let sortDirection =
  "asc";


/* =========================================================
   CR DROPDOWNS
========================================================= */

function buildCRDropdowns(){

  const minSelect =
    document.getElementById(
      "crMin"
    );

  const maxSelect =
    document.getElementById(
      "crMax"
    );


  minSelect.innerHTML = "";
  maxSelect.innerHTML = "";


  CR_VALUES.forEach(
    cr => {

      const minOption =
        document.createElement(
          "option"
        );

      minOption.value =
        cr.value === null
          ? ""
          : cr.value;

      minOption.textContent =
        cr.label;


      minSelect.appendChild(
        minOption
      );


      const maxOption =
        document.createElement(
          "option"
        );

      maxOption.value =
        cr.value === null
          ? ""
          : cr.value;

      maxOption.textContent =
        cr.label;


      maxSelect.appendChild(
        maxOption
      );

    }
  );


  minSelect.value =
    "";

  maxSelect.value =
    "";

}


/* =========================================================
   SHEET LADEN
========================================================= */

async function loadSheet(){

  try{

    const url =
      `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?sheet=${encodeURIComponent(SHEET_NAME)}`;


    const response =
      await fetch(
        url
      );


    if(!response.ok){

      throw new Error(
        `Google Sheets HTTP ${response.status}`
      );

    }


    const text =
      await response.text();


    const json =
      JSON.parse(
        text
          .substring(47)
          .slice(0,-2)
      );


    const rows =
      json.table.rows;


    monsters =
      rows
        .map(
          row => {

            const cells =
              row.c || [];


            const monster = {

              name:
                cells[0]?.v ?? "",


              link:
                getCellLink(
                  cells[1]
                ),


              cr:
                parseCR(
                  cells[2]?.f ??
                  cells[2]?.v
                ),


              xp:
                parseNumber(
                  cells[3]?.f ??
                  cells[3]?.v
                ),


              unique:
                String(
                  cells[4]?.f ??
                  cells[4]?.v ??
                  ""
                ).trim(),


              habitats:{},


              climates:{}

            };


            HABITATS.forEach(
              habitat => {

                monster.habitats[
                  habitat.label
                ] =
                  parseScore(
                    cells[
                      habitat.columnIndex
                    ]?.f ??
                    cells[
                      habitat.columnIndex
                    ]?.v
                  );

              }
            );


            CLIMATES.forEach(
              climate => {

                monster.climates[
                  climate.label
                ] =
                  parseScore(
                    cells[
                      climate.columnIndex
                    ]?.f ??
                    cells[
                      climate.columnIndex
                    ]?.v
                  );

              }
            );


            return monster;

          }
        )
        .filter(
          monster =>
            monster.name
        );


    buildHabitatUI();

    buildClimateUI();

    updateClimateUI();

    filterMonsters();


  }catch(error){

    console.error(
      "Fehler beim Laden der Monsterdaten:",
      error
    );


    document.getElementById(
      "tableBody"
    ).innerHTML = `

      <tr>

        <td colspan="7">
          Fehler beim Laden der Monsterdaten.
        </td>

      </tr>

    `;

  }

}


/* =========================================================
   LINK
========================================================= */

function getCellLink(cell){

  if(!cell)
    return "";


  if(cell.u)
    return cell.u;


  if(cell.href)
    return cell.href;


  if(cell.link)
    return cell.link;


  const value =
    String(
      cell.v ?? ""
    ).trim();


  if(
    value.startsWith("http://") ||
    value.startsWith("https://")
  ){

    return value;

  }


  return "";

}


/* =========================================================
   ZAHLEN
========================================================= */

function parseNumber(value){

  if(
    value === undefined ||
    value === null ||
    value === ""
  ){

    return 0;

  }


  if(
    typeof value === "number"
  ){

    return value;

  }


  const text =
    String(value)
      .trim()
      .replace(/\./g,"")
      .replace(",", ".");


  return Number(text) || 0;

}


/* =========================================================
   CR
========================================================= */

function parseCR(value){

  if(
    value === undefined ||
    value === null ||
    value === ""
  ){

    return 0;

  }


  let text =
    String(value)
      .trim()
      .toLowerCase()
      .replace(
        /^cr\s*/,
        ""
      );


  if(
    text.includes("/")
  ){

    const parts =
      text.split("/");


    const numerator =
      Number(
        parts[0].trim()
      );


    const denominator =
      Number(
        parts[1].trim()
      );


    if(
      !isNaN(numerator) &&
      !isNaN(denominator) &&
      denominator !== 0
    ){

      return (
        numerator /
        denominator
      );

    }

  }


  const unicodeFractions = {

    "⅛":0.125,
    "¼":0.25,
    "½":0.5

  };


  if(
    Object.prototype.hasOwnProperty.call(
      unicodeFractions,
      text
    )
  ){

    return unicodeFractions[text];

  }


  const number =
    Number(
      text.replace(
        ",",
        "."
      )
    );


  return isNaN(number)
    ? 0
    : number;

}


/* =========================================================
   SCORE
========================================================= */

function parseScore(value){

  if(
    value === undefined ||
    value === null ||
    value === ""
  ){

    return null;

  }


  const number =
    Number(
      String(value)
        .replace(",",".")
        .trim()
    );


  if(
    isNaN(number)
  ){

    return null;

  }


  return Math.max(
    1,
    Math.min(
      5,
      number
    )
  );

}

/* =========================================================
   HABITAT SCORE
=========================================================

   Nur ausgewählte Lebensräume werden berücksichtigt.

   Beispiel:

   Region:
   Wald 5
   Küste 2

   Monster:
   Wald 4
   Küste 5

   Lebensraum-Score:

   (4×5 + 5×2)
   ----------------
   (5 + 2)

   = 4.29

========================================================= */

function getHabitatScore(monster){

  const habitats =
    Object.keys(
      regionWeights
    );


  if(
    habitats.length === 0
  ){

    return null;

  }


  let weightedScore =
    0;


  let totalWeight =
    0;


  habitats.forEach(
    habitat => {

      const monsterScore =
        monster.habitats[
          habitat
        ];


      if(
        monsterScore === null ||
        monsterScore === undefined
      ){

        return;

      }


      const regionWeight =
        regionWeights[
          habitat
        ];


      weightedScore +=
        monsterScore *
        regionWeight;


      totalWeight +=
        regionWeight;

    }
  );


  if(
    totalWeight === 0
  ){

    return null;

  }


  return (
    weightedScore /
    totalWeight
  );

}


/* =========================================================
   KLIMA SCORE
========================================================= */

function getClimateScore(monster){

  if(
    !selectedClimate
  ){

    return null;

  }


  return (
    monster.climates[
      selectedClimate
    ] ?? null
  );

}


/* =========================================================
   GESAMT
=========================================================

   2/3 Lebensraum
   1/3 Klima

========================================================= */

function getTotalScore(monster){

  const habitat =
    getHabitatScore(
      monster
    );


  const climate =
    getClimateScore(
      monster
    );


  if(
    habitat === null &&
    climate === null
  ){

    return null;

  }


  if(
    habitat === null
  ){

    return climate;

  }


  if(
    climate === null
  ){

    return habitat;

  }


  return (
    habitat * (2 / 3) +
    climate * (1 / 3)
  );

}


/* =========================================================
   STERNE
========================================================= */

function getStars(score){

  if(
    score === null ||
    score === undefined
  ){

    return "—";

  }


  const rounded =
    Math.max(
      1,
      Math.min(
        5,
        Math.round(score)
      )
    );


  return (
    "★".repeat(
      rounded
    ) +
    "☆".repeat(
      5 - rounded
    )
  );

}

/* =========================================================
   SCORE FORMAT
========================================================= */

function formatScore(score){

  if(
    score === null ||
    score === undefined
  ){

    return "—";

  }


  return score.toFixed(
    2
  );

}


/* =========================================================
   FILTER
========================================================= */

function filterMonsters(){

  const search =
    document
      .getElementById(
        "searchInput"
      )
      .value
      .toLowerCase()
      .trim();


  const crMinValue =
    document.getElementById(
      "crMin"
    ).value;


  const crMaxValue =
    document.getElementById(
      "crMax"
    ).value;


  const crMin =
    crMinValue === ""
      ? null
      : Number(
          crMinValue
        );


  const crMax =
    crMaxValue === ""
      ? null
      : Number(
          crMaxValue
        );


  const xpMin =
    parseFloat(
      document.getElementById(
        "xpMin"
      ).value
    );


  const xpMax =
    parseFloat(
      document.getElementById(
        "xpMax"
      ).value
    );


  let filtered =
    monsters.filter(
      monster => {


        if(
          !showUnique &&
          monster.unique === "Ja"
        ){

          return false;

        }


        if(
          crMin !== null &&
          monster.cr < crMin
        ){

          return false;

        }


        if(
          crMax !== null &&
          monster.cr > crMax
        ){

          return false;

        }


        if(
          !isNaN(xpMin) &&
          monster.xp < xpMin
        ){

          return false;

        }


        if(
          !isNaN(xpMax) &&
          monster.xp > xpMax
        ){

          return false;

        }


        if(
          search &&
          !monster.name
            .toLowerCase()
            .includes(
              search
            )
        ){

          return false;

        }


        return true;

      }
    );


  filtered.sort(
    (a,b)=>{

      let x;
      let y;


      switch(
        sortColumn
      ){

        case "cr":

          x = a.cr;
          y = b.cr;

          break;


        case "xp":

          x = a.xp;
          y = b.xp;

          break;


        case "total":

          x =
            getTotalScore(
              a
            );

          y =
            getTotalScore(
              b
            );

          break;


        case "habitat":

          x =
            getHabitatScore(
              a
            );

          y =
            getHabitatScore(
              b
            );

          break;


        case "climate":

          x =
            getClimateScore(
              a
            );

          y =
            getClimateScore(
              b
            );

          break;


        default:

          x = a.name;
          y = b.name;

      }


      if(
        x === null ||
        x === undefined
      ){

        x = -1;

      }


      if(
        y === null ||
        y === undefined
      ){

        y = -1;

      }


      if(
        typeof x === "string"
      ){

        x =
          x.toLowerCase();

        y =
          y.toLowerCase();

      }


      if(
        x < y
      ){

        return sortDirection === "asc"
          ? -1
          : 1;

      }


      if(
        x > y
      ){

        return sortDirection === "asc"
          ? 1
          : -1;

      }


      return 0;

    }
  );


  renderTable(
    filtered
  );


  renderMobileCards(
    filtered
  );


  document
    .getElementById(
      "resultCount"
    )
    .textContent =
      filtered.length;

}

        getHabitatScore(
          monster
        );


      const climate =
        getClimateScore(
          monster
        );


      card.innerHTML = `

        <div class="mobile-card-title">

          ${nameHTML}

          <button
            type="button"
            class="info-button"
            data-monster-index="${index}"
          >
            Info
          </button>

        </div>


        <div class="mobile-card-grid">

          <div>

            <div class="mobile-label">
              CR
            </div>

            <div class="mobile-value">
              ${formatCR(
                monster.cr
              )}
            </div>

          </div>


          <div>

            <div class="mobile-label">
              XP
            </div>

            <div class="mobile-value">
              ${monster.xp.toLocaleString(
                "de-DE"
              )}
            </div>

          </div>


          <div>

            <div class="mobile-label">
              Einzigartig
            </div>

            <div class="mobile-value">
              ${escapeHTML(
                monster.unique || "-"
              )}
            </div>

          </div>


          <div>

            <div class="mobile-label">
              Gesamt
            </div>

            <div class="mobile-score">
              ${formatScore(
                total
              )}
            </div>

          </div>


          <div>

            <div class="mobile-label">
              Lebensraum
            </div>

            <div class="mobile-value">
              ${formatScore(
                habitat
              )}
            </div>

          </div>


          <div>

            <div class="mobile-label">
              Klima
            </div>

            <div class="mobile-value">
              ${formatScore(
                climate
              )}
              –
              ${escapeHTML(
                selectedClimate
              )}
            </div>

          </div>

        </div>

      `;


      container.appendChild(
        card
      );

    }
  );


  attachInfoButtons();

}

        .querySelector(

/* =========================================================
   SORTIERUNG
========================================================= */

document
  .querySelectorAll(
    ".sortable"
  )
  .forEach(
    header => {

      header.addEventListener(
        "click",
        ()=>{

          const column =
            header.dataset.sort;


          if(
            sortColumn === column
          ){

            sortDirection =
              sortDirection === "asc"
                ? "desc"
                : "asc";

          }else{

            sortColumn =
              column;


            /*
             * Score-Spalten starten
             * absteigend.
             */

            if(
              column === "total" ||
              column === "habitat" ||
              column === "climate"
            ){

              sortDirection =
                "desc";

            }else{

              sortDirection =
                "asc";

            }

          }


          document
            .querySelectorAll(
              ".sort-arrow"
            )
            .forEach(
              arrow =>
                arrow.textContent = ""
            );


          header
            .querySelector(
              ".sort-arrow"
            )
            .textContent =
              sortDirection === "asc"
                ? "▲"
                : "▼";


          filterMonsters();

        }
      );

    }
  );

/* =========================================================
   SCROLL TOP
========================================================= */

const scrollTopBtn =
  document.getElementById(
    "scrollTopBtn"
  );


function isMobile(){

  return window.innerWidth <= 700;

}


function getCurrentScroll(){

  return isMobile()

    ? document.documentElement
        .scrollTop ||
      window.pageYOffset

    : document
        .querySelector(
          ".table-section"
        )
        .scrollTop;

}


function toggleScrollButton(){

  if(
    getCurrentScroll() > 300
  ){

    scrollTopBtn.classList.add(
      "show"
    );

  }else{

    scrollTopBtn.classList.remove(
      "show"
    );

  }

}


window.addEventListener(
  "scroll",
  toggleScrollButton,
  {
    passive:true
  }
);


document
  .querySelector(
    ".table-section"
  )
  .addEventListener(
    "scroll",
    toggleScrollButton,
    {
      passive:true
    }
  );


scrollTopBtn.addEventListener(
  "click",
  ()=>{

    if(
      isMobile()
    ){

      window.scrollTo({
        top:0,
        behavior:"smooth"
      });

    }else{

      document
        .querySelector(
          ".table-section"
        )
        .scrollTo({
          top:0,
          behavior:"smooth"
        });

    }

  }
);


/* =========================================================
   ESCAPE
========================================================= */

function escapeHTML(value){

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


function escapeAttribute(value){

  return escapeHTML(
    value
  );

}
