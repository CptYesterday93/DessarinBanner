<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>DnD Monster Database – V18</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">

<style>

*{
  box-sizing:border-box;
}

html,
body{
  height:100%;
}

body{
  margin:0;
  background:#181818;
  color:white;
  font-family:Arial,sans-serif;
  overflow:hidden;
}

.container{
  display:grid;
  grid-template-columns:minmax(0,1fr) 340px;
  gap:20px;
  padding:20px;
  height:100vh;
  align-items:start;
  transition:grid-template-columns .25s ease;
}

.container.sidebar-collapsed{
  grid-template-columns:minmax(0,1fr) 0px;
}

.table-section{
  min-width:0;
  height:calc(100vh - 40px);
  overflow:auto;
  border-radius:16px;
}

.sidebar{
  background:#242424;
  border-radius:16px;
  padding:22px;
  position:sticky;
  top:20px;
  height:calc(100vh - 40px);
  overflow:auto;
  border:1px solid #3a3a3a;

  transition:
    transform .25s ease,
    opacity .25s ease;
}

.container.sidebar-collapsed .sidebar{
  opacity:0;
  pointer-events:none;
  overflow:hidden;
}

h1,
h2,
h3{
  font-family:"Cinzel",serif;
}

.topbar{
  margin-bottom:16px;
}

input,
select,
button{
  width:100%;
  padding:11px;
  border-radius:10px;
  border:1px solid #444;
  background:#1d1d1d;
  color:white;
  font-size:15px;
}

button{
  cursor:pointer;
}

select{
  cursor:pointer;
}

input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button{
  -webkit-appearance:none;
  margin:0;
}

input[type="number"]{
  -moz-appearance:textfield;
  appearance:textfield;
}

.filter-group{
  margin-bottom:20px;
}

.filter-group > label{
  display:block;
  margin-bottom:8px;
  font-weight:bold;
}

.range-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

/* =========================================================
   LEBENSRAUM AKTIONEN
========================================================= */

.habitat-actions{
  display:grid;
  grid-template-columns:1.35fr 1fr 1fr;
  gap:7px;
  margin-bottom:9px;
}

.habitat-action{
  width:auto;
  padding:7px 8px;
  font-size:12px;
  font-weight:bold;
  background:#303030;
  border:1px solid #4a4a4a;
}

.habitat-action:hover{
  background:#3a3a3a;
}

.habitat-action.apply{
  background:#4f46e5;
  border-color:#6d63ff;
}

.habitat-action.apply:hover{
  background:#5b52ef;
}

/* =========================================================
   EINZIGARTIGE
========================================================= */

.unique-toggle{
  display:flex;
  align-items:center;
  gap:9px;

  width:max-content;

  padding:7px 10px;

  border:1px solid #444;
  border-radius:8px;

  background:#292929;
  color:#aaa;

  font-size:13px;
}

.unique-toggle:hover{
  background:#333;
  color:#ddd;
}

.unique-toggle-indicator{
  width:14px;
  height:14px;

  border:1px solid #666;
  border-radius:4px;

  background:#1d1d1d;

  transition:
    background .15s ease,
    border-color .15s ease;
}

.unique-toggle.active{
  color:white;
}

.unique-toggle.active
.unique-toggle-indicator{
  background:#4f46e5;
  border-color:#7c74ff;
}

/* =========================================================
   KLIMA
========================================================= */

.climate-select{
  display:flex;
  gap:8px;
}

.climate-select button{
  width:auto;
  flex:1;

  background:#333;
  padding:10px 12px;
}

.climate-select button.active{
  background:#4f46e5;
  border-color:#7c74ff;
}

/* =========================================================
   REGIONSPROFIL
========================================================= */

.region-profiles{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}

.region-row{
  min-width:0;

  display:flex;
  align-items:center;
  gap:5px;

  min-height:36px;

  padding:5px 6px;

  background:#292929;
  border:1px solid #3b3b3b;
  border-radius:8px;
}

.region-name-button{
  flex:1;
  min-width:0;

  width:auto;

  padding:5px 3px;

  border:none;
  background:transparent;

  color:#ddd;

  text-align:left;
  font-size:12px;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.region-name-button:hover{
  color:white;
}

.region-row.active
.region-name-button{
  color:white;
  font-weight:bold;
}

.region-stars{
  display:flex;
  gap:0;
  flex-shrink:0;
}

.region-star{
  width:auto;
  padding:0 1px;

  border:none;
  background:transparent;

  color:#555;

  font-size:14px;
  line-height:1;

  cursor:pointer;
}

.region-star:hover{
  color:#aaa;
}

.region-star.active{
  color:#f0c75e;
}

.region-remove{
  flex:0 0 20px;

  width:20px;

  padding:2px 0;

  background:transparent;

  border:none;

  color:#888;

  font-size:15px;
  line-height:1;
}

.region-remove:hover{
  color:white;
}

/* =========================================================
   TABELLE
========================================================= */

table{
  width:100%;
  border-collapse:separate;
  border-spacing:0;
  background:#222;
  border-radius:14px;
  overflow:visible;
}

th,
td{
  padding:12px;
  text-align:left;
  vertical-align:top;

  border-bottom:1px solid #3f3f3f;
  border-right:1px solid rgba(255,255,255,.06);

  box-shadow:
    inset -1px 0 0 rgba(255,255,255,.03);
}

th:last-child,
td:last-child{
  border-right:none;
}

th{
  background:#303030;
  position:sticky;
  top:0;
  z-index:50;

  box-shadow:
    0 2px 10px rgba(0,0,0,.35);
}

.sortable{
  cursor:pointer;
  user-select:none;
}

.sortable:hover{
  background:#3b3b3b;
}

.sort-arrow{
  margin-left:6px;
  font-size:12px;
  opacity:.8;
}

tbody tr:nth-child(even){
  background:#242424;
}

tbody tr:nth-child(odd){
  background:#2c2c2c;
}

tbody tr{
  transition:
    background .18s ease,
    box-shadow .18s ease;
}

tbody tr:hover{
  background:#353535;

  box-shadow:
    inset 3px 0 0 #6d63ff,
    inset 0 0 0 1px rgba(255,255,255,.04);
}

/* =========================================================
   MONSTERNAME
========================================================= */

.monster-cell{
  display:flex;
  align-items:center;
  gap:8px;
  min-width:220px;
}

.monster-link{
  color:#8ecbff;
  text-decoration:none;
  font-weight:bold;
}

.monster-link:hover{
  text-decoration:underline;
}

.info-button{
  width:auto;

  padding:4px 7px;

  background:#333;
  border:1px solid #4a4a4a;

  border-radius:6px;

  color:#aaa;

  font-size:11px;
  line-height:1;
}

.info-button:hover{
  background:#444;
  color:white;
}

/* =========================================================
   WERTE
========================================================= */

.unique-yes{
  color:#ff9b42;
  font-weight:bold;
}

.unique-no{
  color:#aaa;
}

.score{
  font-weight:bold;
  white-space:nowrap;
}

.score-total{
  font-size:16px;
}

.score-detail{
  margin-top:6px;

  display:flex;
  flex-wrap:wrap;
  gap:5px 12px;

  font-size:12px;
  line-height:1.35;

  color:#d5d5d5;
}

.score-detail-item{
  white-space:nowrap;
}

.score-detail-name{
  opacity:.85;
  margin-right:4px;
}

.score-detail-stars{
  letter-spacing:1px;
}

/* =========================================================
   SUCHE
========================================================= */

.search-row{
  display:flex;
  gap:8px;
}

.search-row input{
  flex:1;
}

.search-row button{
  width:auto;
  padding:0 14px;

  background:#383838;
  border:1px solid #555;

  font-weight:bold;
}

/* =========================================================
   SIDEBAR TOGGLE
========================================================= */

.toggle-sidebar{
  display:none;

  position:fixed;
  top:16px;
  right:16px;

  z-index:10000;

  width:auto;

  padding:12px 16px;

  border:none;
  border-radius:12px;

  background:#4f46e5;
  color:white;

  font-weight:bold;
}

.desktop-toggle{
  display:block;
}

/* =========================================================
   MOBILE
========================================================= */

.mobile-cards{
  display:none;
}

.mobile-card{
  background:#242424;
  border:1px solid #3f3f3f;
  border-radius:16px;
  padding:16px;
  margin-bottom:14px;
}

.mobile-card-title{
  font-size:18px;
  font-weight:bold;
  margin-bottom:12px;

  display:flex;
  align-items:center;
  gap:8px;
}

.mobile-card-title a{
  color:#8ecbff;
  text-decoration:none;
}

.mobile-card-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.mobile-label{
  font-size:12px;
  opacity:.7;
}

.mobile-value{
  font-size:14px;
}

.mobile-score{
  font-size:18px;
  font-weight:bold;
}

/* =========================================================
   MODAL
========================================================= */

.modal-backdrop{
  position:fixed;
  inset:0;

  background:rgba(0,0,0,.7);

  display:none;
  align-items:center;
  justify-content:center;

  z-index:20000;

  padding:20px;
}

.modal-backdrop.open{
  display:flex;
}

.modal{
  width:min(760px,100%);

  max-height:90vh;
  overflow:auto;

  background:#242424;

  border:1px solid #444;
  border-radius:16px;

  box-shadow:
    0 12px 40px rgba(0,0,0,.5);
}

.modal-header{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:20px;

  padding:20px 22px;

  border-bottom:1px solid #3f3f3f;
}

.modal-title{
  margin:0;
  font-size:24px;
}

.modal-close{
  width:auto;

  padding:6px 10px;

  background:#333;
  border:1px solid #4a4a4a;

  font-size:18px;
}

.modal-body{
  padding:22px;
}

.modal-meta{
  display:flex;
  flex-wrap:wrap;
  gap:10px 20px;

  margin-bottom:22px;

  color:#ccc;
}

.modal-section{
  margin-bottom:22px;
}

.modal-section h3{
  margin:0 0 12px 0;
}

.profile-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.profile-item{
  padding:9px 10px;

  background:#2c2c2c;

  border:1px solid #3d3d3d;
  border-radius:8px;

  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.profile-item-name{
  color:#ddd;
}

.profile-item-score{
  white-space:nowrap;
  color:#f0c75e;
  letter-spacing:1px;
}

.modal-link{
  display:inline-block;

  padding:9px 12px;

  background:#4f46e5;

  border-radius:8px;

  color:white;
  text-decoration:none;
  font-weight:bold;
}

.modal-link:hover{
  background:#5b52ef;
}

/* =========================================================
   SCROLL TOP
========================================================= */

#scrollTopBtn{
  position:fixed;
  bottom:20px;
  right:20px;

  width:54px;
  height:54px;

  border:none;
  border-radius:50%;

  background:#4f46e5;
  color:white;

  font-size:24px;
  font-weight:bold;

  cursor:pointer;

  z-index:10001;

  opacity:0;
  pointer-events:none;

  transition:
    opacity .2s ease,
    transform .2s ease;

  box-shadow:
    0 4px 12px rgba(0,0,0,.35);
}

#scrollTopBtn.show{
  opacity:1;
  pointer-events:auto;
}

#scrollTopBtn:hover{
  transform:translateY(-2px);
}

/* =========================================================
   MOBILE MEDIA
========================================================= */

@media (max-width:700px){

  body{
    overflow:auto;
  }

  .container{
    display:flex !important;
    flex-direction:column !important;
    padding:14px;
    height:auto;
  }

  .table-section{
    height:auto;
    max-height:none;
    overflow:visible;
  }

  .sidebar{
    order:-1;

    position:fixed;

    left:0;
    top:0;

    width:100%;
    max-width:100%;
    height:100vh;

    overflow-y:auto;

    z-index:9999;

    border-radius:0;

    transform:translateX(100%);

    transition:transform .25s ease;
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .toggle-sidebar{
    display:block;
  }

  .desktop-toggle{
    display:none;
  }

  .table-section table{
    display:none !important;
  }

  thead,
  tbody{
    display:none !important;
  }

  .mobile-cards{
    display:block;
  }

  .region-profiles{
    grid-template-columns:1fr 1fr;
  }

  .region-row{
    min-height:38px;
  }

  .region-name-button{
    font-size:11px;
  }

  .region-star{
    font-size:13px;
  }

  h1{
    font-size:28px;
    line-height:1.2;
    margin-right:90px;
  }

  .profile-grid{
    grid-template-columns:1fr;
  }

}

</style>
</head>

<body>

<div class="container">

  <div class="table-section">

    <div class="topbar">

    <table>

      <thead>

<script>

/* =========================================================
   GOOGLE SHEET
========================================================= */

const SHEET_ID =
  "1v7egXu70tpq7mkPCmZq4ak7fMu3NzZYPR1Rd2mLx8_0";

const SHEET_NAME =
  "Sheet1";


/* =========================================================
   HABITATE
========================================================= */

const HABITATS = [

  {
    label:"Wald",
    columnIndex:5
  },

  {
    label:"Grasland",
    columnIndex:6
  },

  {
    label:"Wüste",
    columnIndex:7
  },

  {
    label:"Sumpf",
    columnIndex:8
  },

  {
    label:"Gebirge",
    columnIndex:9
  },

  {
    label:"Küste",
    columnIndex:10
  },

  {
    label:"Fluss/See",
    columnIndex:11
  },

  {
    label:"Meer",
    columnIndex:12
  },

  {
    label:"Höhle",
    columnIndex:13
  },

  {
    label:"Untergrund",
    columnIndex:14
  },

  {
    label:"Ruinen",
    columnIndex:15
  },

  {
    label:"Siedlung",
    columnIndex:16
  }

];


/* =========================================================
   KLIMA
========================================================= */

const CLIMATES = [

  {
    label:"Kalt",
    columnIndex:17
  },

  {
    label:"Gemäßigt",
    columnIndex:18
  },

  {
    label:"Heiß",
    columnIndex:19
  }

];


/* =========================================================
   CR
========================================================= */

const CR_VALUES = [

  {
    label:"Alle",
    value:null
  },

  {
    label:"0",
    value:0
  },

  {
    label:"1/8",
    value:0.125
  },

  {
    label:"1/4",
    value:0.25
  },

  {
    label:"1/2",
    value:0.5
  }

];

for(
  let i = 1;
  i <= 30;
  i++
){

  CR_VALUES.push({
    label:String(i),
    value:i
  });

}


/* =========================================================
   STATE
========================================================= */

let monsters = [];

let regionWeights = {};

let appliedRegionWeights = {};

let selectedClimate =
  "Gemäßigt";

let appliedClimate =
  "Gemäßigt";

let showUnique =
  false;

let sortColumn =
  "name";

let sortDirection =
  "asc";


/* =========================================================
   CR DROPDOWNS
========================================================= */

function buildCRDropdowns(){

  const minSelect =
    document.getElementById(
      "crMin"
    );

  const maxSelect =
    document.getElementById(
      "crMax"
    );


  minSelect.innerHTML = "";
  maxSelect.innerHTML = "";


  CR_VALUES.forEach(
    cr => {

      const minOption =
        document.createElement(
          "option"
        );

      minOption.value =
        cr.value === null
          ? ""
          : cr.value;

      minOption.textContent =
        cr.label;


      minSelect.appendChild(
        minOption
      );


      const maxOption =
        document.createElement(
          "option"
        );

      maxOption.value =
        cr.value === null
          ? ""
          : cr.value;

      maxOption.textContent =
        cr.label;


      maxSelect.appendChild(
        maxOption
      );

    }
  );


  minSelect.value =
    "";

  maxSelect.value =
    "";

}


/* =========================================================
   SHEET LADEN
========================================================= */

async function loadSheet(){

  try{

    const url =
      `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?sheet=${encodeURIComponent(SHEET_NAME)}`;


    const response =
      await fetch(
        url
      );


    if(!response.ok){

      throw new Error(
        `Google Sheets HTTP ${response.status}`
      );

    }


    const text =
      await response.text();


    const json =
      JSON.parse(
        text
          .substring(47)
          .slice(0,-2)
      );


    const rows =
      json.table.rows;


    monsters =
      rows
        .map(
          row => {

            const cells =
              row.c || [];


            const monster = {

              name:
                cells[0]?.v ?? "",


              link:
                getCellLink(
                  cells[1]
                ),


              cr:
                parseCR(
                  cells[2]?.f ??
                  cells[2]?.v
                ),


              xp:
                parseNumber(
                  cells[3]?.f ??
                  cells[3]?.v
                ),


              unique:
                String(
                  cells[4]?.f ??
                  cells[4]?.v ??
                  ""
                ).trim(),


              habitats:{},


              climates:{}

            };


            HABITATS.forEach(
              habitat => {

                monster.habitats[
                  habitat.label
                ] =
                  parseScore(
                    cells[
                      habitat.columnIndex
                    ]?.f ??
                    cells[
                      habitat.columnIndex
                    ]?.v
                  );

              }
            );


            CLIMATES.forEach(
              climate => {

                monster.climates[
                  climate.label
                ] =
                  parseScore(
                    cells[
                      climate.columnIndex
                    ]?.f ??
                    cells[
                      climate.columnIndex
                    ]?.v
                  );

              }
            );


            return monster;

          }
        )
        .filter(
          monster =>
            monster.name
        );


    buildHabitatUI();

    buildClimateUI();

    updateClimateUI();

    filterMonsters();


  }catch(error){

    console.error(
      "Fehler beim Laden der Monsterdaten:",
      error
    );


    document.getElementById(
      "tableBody"
    ).innerHTML = `

      <tr>

        <td colspan="7">
          Fehler beim Laden der Monsterdaten.
        </td>

      </tr>

    `;

  }

}


/* =========================================================
   LINK
========================================================= */

function getCellLink(cell){

  if(!cell)
    return "";


  if(cell.u)
    return cell.u;


  if(cell.href)
    return cell.href;


  if(cell.link)
    return cell.link;


  const value =
    String(
      cell.v ?? ""
    ).trim();


  if(
    value.startsWith("http://") ||
    value.startsWith("https://")
  ){

    return value;

  }


  return "";

}


/* =========================================================
   ZAHLEN
========================================================= */

function parseNumber(value){

  if(
    value === undefined ||
    value === null ||
    value === ""
  ){

    return 0;

  }


  if(
    typeof value === "number"
  ){

    return value;

  }


  const text =
    String(value)
      .trim()
      .replace(/\./g,"")
      .replace(",", ".");


  return Number(text) || 0;

}


/* =========================================================
   CR
========================================================= */

function parseCR(value){

  if(
    value === undefined ||
    value === null ||
    value === ""
  ){

    return 0;

  }


  let text =
    String(value)
      .trim()
      .toLowerCase()
      .replace(
        /^cr\s*/,
        ""
      );


  if(
    text.includes("/")
  ){

    const parts =
      text.split("/");


    const numerator =
      Number(
        parts[0].trim()
      );


    const denominator =
      Number(
        parts[1].trim()
      );


    if(
      !isNaN(numerator) &&
      !isNaN(denominator) &&
      denominator !== 0
    ){

      return (
        numerator /
        denominator
      );

    }

  }


  const unicodeFractions = {

    "⅛":0.125,
    "¼":0.25,
    "½":0.5

  };


  if(
    Object.prototype.hasOwnProperty.call(
      unicodeFractions,
      text
    )
  ){

    return unicodeFractions[
      text
    ];

  }


  const number =
    Number(
      text.replace(
        ",",
        "."
      )
    );


  return isNaN(number)
    ? 0
    : number;

}


/* =========================================================
   CR FORMAT
========================================================= */

function formatCR(value){

  if(
    value === undefined ||
    value === null ||
    isNaN(value)
  ){

    return "—";

  }


  if(value === 0){
    return "0";
  }


  if(value === 0.125){
    return "1/8";
  }


  if(value === 0.25){
    return "1/4";
  }


  if(value === 0.5){
    return "1/2";
  }


  return String(value);

}


/* =========================================================
   SCORE
========================================================= */

function parseScore(value){

  if(
    value === undefined ||
    value === null ||
    value === ""
  ){

    return null;

  }


  const number =
    Number(
      String(value)
        .replace(",",".")
        .trim()
    );


  if(
    isNaN(number)
  ){

    return null;

  }


  return Math.max(
    1,
    Math.min(
      5,
      number
    )
  );

}

/* =========================================================
   PROFILÄHNLICHKEIT
========================================================= */

/*
 * Zielwert = Wert des gewünschten Profils
 *
 * Monsterwert = tatsächlicher Wert des Monsters
 *
 * Abstand 0:
 *     perfekte Übereinstimmung
 *
 * Je größer der Abstand,
 * desto kleiner die Ähnlichkeit.
 *
 * Das Quadrat sorgt dafür,
 * dass große Abweichungen
 * deutlich stärker bestraft werden.
 *
 * 5 gesucht / 5 Monster = 1.00
 * 5 gesucht / 4 Monster = 0.9375
 * 5 gesucht / 3 Monster = 0.75
 * 5 gesucht / 1 Monster = 0.00
 *
 * 2 gesucht / 2 Monster = 1.00
 * 2 gesucht / 3 Monster = 0.9375
 * 2 gesucht / 5 Monster = 0.4375
 */

function profileSimilarity(
  monsterScore,
  targetScore
){

  if(
    monsterScore === null ||
    monsterScore === undefined ||
    targetScore === null ||
    targetScore === undefined
  ){

    return null;

  }


  const difference =
    Math.abs(
      monsterScore -
      targetScore
    );


  return Math.max(
    0,
    1 -
    (
      difference *
      difference
    ) / 16
  );

}


/* =========================================================
   HABITAT SCORE
========================================================= */

function getHabitatSimilarity(
  monster
){

  const habitats =
    Object.keys(
      appliedRegionWeights
    );


  if(
    habitats.length === 0
  ){

    return null;

  }


  let similarityTotal =
    0;

  let count =
    0;


  for(
    let i = 0;
    i < habitats.length;
    i++
  ){

    const habitat =
      habitats[i];


    const monsterScore =
      monster.habitats[
        habitat
      ];


    const targetScore =
      appliedRegionWeights[
        habitat
      ];


    const similarity =
      profileSimilarity(
        monsterScore,
        targetScore
      );


    if(
      similarity === null
    ){

      continue;

    }


    similarityTotal +=
      similarity;


    count++;

  }


  if(
    count === 0
  ){

    return null;

  }


  return (
    similarityTotal /
    count
  );

}


/* =========================================================
   KLIMA SCORE
========================================================= */

function getClimateSimilarity(
  monster
){

  const monsterScore =
    monster.climates[
      appliedClimate
    ];


  if(
    monsterScore === null ||
    monsterScore === undefined
  ){

    return null;

  }


  /*
   * Das Klima selbst bekommt
   * standardmäßig den Zielwert 5.
   *
   * Dadurch bedeutet die Auswahl
   * Kalt / Gemäßigt / Heiß:
   * Wir suchen Monster, die in diesem
   * Klima besonders typisch sind.
   */

  return profileSimilarity(
    monsterScore,
    5
  );

}


/* =========================================================
   GESAMT
========================================================= */

function calculateScores(
  monster
){

  const habitat =
    getHabitatSimilarity(
      monster
    );


  const climate =
    getClimateSimilarity(
      monster
    );


  let total =
    null;


  if(
    habitat === null &&
    climate === null
  ){

    total = null;

  }else if(
    habitat === null
  ){

    total = climate;

  }else if(
    climate === null
  ){

    total = habitat;

  }else{

    total =
      habitat * (2 / 3) +
      climate * (1 / 3);

  }


  return {
    habitat,
    climate,
    total
  };

}


/* =========================================================
   SCORE FORMAT
========================================================= */

function formatScore(
  score
){

  if(
    score === null ||
    score === undefined
  ){

    return "—";

  }


  return score.toFixed(
    2
  );

}


/* =========================================================
   STERNE
========================================================= */

function getStars(
  score
){

  if(
    score === null ||
    score === undefined
  ){

    return "—";

  }


  const rounded =
    Math.max(
      1,
      Math.min(
        5,
        Math.round(score)
      )
    );


  return (
    "★".repeat(
      rounded
    ) +
    "☆".repeat(
      5 - rounded
    )
  );

}

/* =========================================================
   FILTER
========================================================= */

function filterMonsters(){

  const search =
    document
      .getElementById(
        "searchInput"
      )
      .value
      .toLowerCase()
      .trim();


  const crMinValue =
    document.getElementById(
      "crMin"
    ).value;


  const crMaxValue =
    document.getElementById(
      "crMax"
    ).value;


  const crMin =
    crMinValue === ""
      ? null
      : Number(
          crMinValue
        );


  const crMax =
    crMaxValue === ""
      ? null
      : Number(
          crMaxValue
        );


  const xpMin =
    parseFloat(
      document.getElementById(
        "xpMin"
      ).value
    );


  const xpMax =
    parseFloat(
      document.getElementById(
        "xpMax"
      ).value
    );


  const isMobileView =
    window.innerWidth <= 700;


  const filtered = [];


  for(
    let i = 0;
    i < monsters.length;
    i++
  ){

    const monster =
      monsters[i];


    if(
      !showUnique &&
      monster.unique === "Ja"
    ){

      continue;

    }


    if(
      crMin !== null &&
      monster.cr < crMin
    ){

      continue;

    }


    if(
      crMax !== null &&
      monster.cr > crMax
    ){

      continue;

    }


    if(
      !isNaN(xpMin) &&
      monster.xp < xpMin
    ){

      continue;

    }


    if(
      !isNaN(xpMax) &&
      monster.xp > xpMax
    ){

      continue;

    }


    if(
      search &&
      !monster.name
        .toLowerCase()
        .includes(
          search
        )
    ){

      continue;

    }


    const scores =
      calculateScores(
        monster
      );


    filtered.push({

      monster,

      index:i,

      habitat:
        scores.habitat,

      climate:
        scores.climate,

      total:
        scores.total

    });

  }


  filtered.sort(
    (a,b)=>{

      let x;
      let y;


      switch(
        sortColumn
      ){

        case "cr":

          x =
            a.monster.cr;

          y =
            b.monster.cr;

          break;


        case "xp":

          x =
            a.monster.xp;

          y =
            b.monster.xp;

          break;


        case "total":

          x =
            a.total;

          y =
            b.total;

          break;


        case "habitat":

          x =
            a.habitat;

          y =
            b.habitat;

          break;


        case "climate":

          x =
            a.climate;

          y =
            b.climate;

          break;


        default:

          x =
            a.monster.name;

          y =
            b.monster.name;

      }


      if(
        x === null ||
        x === undefined
      ){

        x = -1;

      }


      if(
        y === null ||
        y === undefined
      ){

        y = -1;

      }


      if(
        typeof x === "string"
      ){

        x =
          x.toLowerCase();

        y =
          y.toLowerCase();

      }


      if(
        x < y
      ){

        return sortDirection === "asc"
          ? -1
          : 1;

      }


      if(
        x > y
      ){

        return sortDirection === "asc"
          ? 1
          : -1;

      }


      return 0;

    }
  );


  if(
    isMobileView
  ){

    renderMobileCards(
      filtered
    );

  }else{

    renderTable(
      filtered
    );

  }


  document
    .getElementById(
      "resultCount"
    )
    .textContent =
      filtered.length;

}

/* =========================================================
   INFO MODAL
========================================================= */

function openInfoModal(
  monster
){

  if(!monster)
    return;


  const modal =
    document.getElementById(
      "infoModal"
    );


  const title =
    document.getElementById(
      "modalTitle"
    );


  const body =
    document.getElementById(
      "modalBody"
    );


  title.textContent =
    monster.name;


  let habitatHTML =
    "";


  HABITATS.forEach(
    habitat => {

      const score =
        monster.habitats[
          habitat.label
        ];


      habitatHTML += `

        <div class="profile-item">

          <span class="profile-item-name">
            ${escapeHTML(
              habitat.label
            )}
          </span>

          <span class="profile-item-score">
            ${getStars(
              score
            )}
          </span>

        </div>

      `;

    }
  );


  let climateHTML =
    "";


  CLIMATES.forEach(
    climate => {

      const score =
        monster.climates[
          climate.label
        ];


      climateHTML += `

        <div class="profile-item">

          <span class="profile-item-name">
            ${escapeHTML(
              climate.label
            )}
          </span>

          <span class="profile-item-score">
            ${getStars(
              score
            )}
          </span>

        </div>

      `;

    }
  );


  const scores =
    calculateScores(
      monster
    );


  body.innerHTML = `

    <div class="modal-meta">

      <span>

        <strong>CR:</strong>

        ${formatCR(
          monster.cr
        )}

      </span>


      <span>

        <strong>XP:</strong>

        ${monster.xp.toLocaleString(
          "de-DE"
        )}

      </span>


      <span>

        <strong>Einzigartig:</strong>

        ${escapeHTML(
          monster.unique || "-"
        )}

      </span>

    </div>


    <div class="modal-section">

      <h3>
        Aktuelle Bewertung
      </h3>


      <div class="profile-grid">

        <div class="profile-item">

          <span class="profile-item-name">
            Gesamt
          </span>

          <span class="profile-item-score">
            ${formatScore(
              scores.total
            )}
          </span>

        </div>


        <div class="profile-item">

          <span class="profile-item-name">
            Lebensraum
          </span>

          <span class="profile-item-score">
            ${formatScore(
              scores.habitat
            )}
          </span>

        </div>


        <div class="profile-item">

          <span class="profile-item-name">
            Klima (${escapeHTML(
              appliedClimate
            )})
          </span>

          <span class="profile-item-score">
            ${formatScore(
              scores.climate
            )}
          </span>

        </div>

      </div>

    </div>


    <div class="modal-section">

      <h3>
        Lebensräume
      </h3>


      <div class="profile-grid">

        ${habitatHTML}

      </div>

    </div>


    <div class="modal-section">

      <h3>
        Klima
      </h3>


      <div class="profile-grid">

        ${climateHTML}

      </div>

    </div>


    ${
      monster.link
        ? `

          <a
            class="modal-link"
            href="${escapeAttribute(
              monster.link
            )}"
            target="_blank"
            rel="noopener noreferrer"
          >
            Auf D&D Beyond öffnen
          </a>

        `
        : ""
    }

  `;


  modal.classList.add(
    "open"
  );

}

/* =========================================================

========================================================= */

document
  .querySelectorAll(
    ".sortable"
  )
  .forEach(
    header => {

      header.addEventListener(
        "click",
        ()=>{

          const column =
            header.dataset.sort;


          if(
            sortColumn === column
          ){

            sortDirection =
              sortDirection === "asc"
                ? "desc"
                : "asc";

          }else{

            sortColumn =
              column;


            if(
              column === "total" ||
              column === "habitat" ||
              column === "climate"
            ){

              sortDirection =
                "desc";

            }else{

              sortDirection =
                "asc";

            }

          }


          document
            .querySelectorAll(
              ".sort-arrow"
            )
            .forEach(
              arrow =>
                arrow.textContent = ""
            );


          header
            .querySelector(
              ".sort-arrow"
            )
            .textContent =
              sortDirection === "asc"
                ? "▲"
                : "▼";


          filterMonsters();

        }
      );

    }
  );

/* =========================================================
   SCROLL TOP
========================================================= */

const scrollTopBtn =
  document.getElementById(
    "scrollTopBtn"
  );


function isMobile(){

  return window.innerWidth <= 700;

}


function getCurrentScroll(){

  return isMobile()

    ? document.documentElement
        .scrollTop ||
      window.pageYOffset

    : document
        .querySelector(
          ".table-section"
        )
        .scrollTop;

}


function toggleScrollButton(){

  if(
    getCurrentScroll() > 300
  ){

    scrollTopBtn.classList.add(
      "show"
    );

  }else{

    scrollTopBtn.classList.remove(
      "show"
    );

  }

}


window.addEventListener(
  "scroll",
  toggleScrollButton,
  {
    passive:true
  }
);


document
  .querySelector(
    ".table-section"
  )
  .addEventListener(
    "scroll",
    toggleScrollButton,
    {
      passive:true
    }
  );


scrollTopBtn.addEventListener(
  "click",
  ()=>{

    if(
      isMobile()
    ){

      window.scrollTo({
        top:0,
        behavior:"smooth"
      });

    }else{

      document
        .querySelector(
          ".table-section"
        )
        .scrollTo({
          top:0,
          behavior:"smooth"
        });

    }

  }
);


/* =========================================================
   ESCAPE
========================================================= */

function escapeHTML(
  value
){

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


function escapeAttribute(
  value
){

  return escapeHTML(
    value
  );

}
