<script>

/* =========================================================
   GOOGLE SHEET
   ========================================================= */

const SHEET_ID =
  "1v7egXu70tpq7mkPCmZq4ak7fMu3NzZYPR1Rd2mLx8_0";

const SHEET_NAME = "Sheet1";


/* =========================================================
   HABITATE
   UI-NAME → GOOGLE-SHEET-SPALTENNAME
   ========================================================= */

const HABITATS = [
  {
    label:"Wald",
    column:"Wald"
  },
  {
    label:"Grasland",
    column:"Grasland"
  },
  {
    label:"Wüste",
    column:"Wüste"
  },
  {
    label:"Hügel",
    column:"Hügel"
  },
  {
    label:"Gebirge",
    column:"Gebirge"
  },
  {
    label:"Sumpf",
    column:"Sumpf/Moor"
  },
  {
    label:"Küste",
    column:"Küste"
  },
  {
    label:"Süßwasser",
    column:"Süßwasser"
  },
  {
    label:"Höhle",
    column:"Höhle"
  },
  {
    label:"Tunnel",
    column:"Tunnel/Underdark"
  },
  {
    label:"Arktis",
    column:"Arktis"
  },
  {
    label:"Vulkanisch",
    column:"Vulkanisch"
  },
  {
    label:"Urban",
    column:"Urban"
  }
];


/* =========================================================
   STATE
   ========================================================= */

let monsters = [];

let selectedHabitats = [];

let uniqueState = "Alle";

let sortColumn = "name";
let sortDirection = "asc";


/* =========================================================
   LOAD SHEET
   ========================================================= */

async function loadSheet(){

  try{

    const url =
      `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?sheet=${encodeURIComponent(SHEET_NAME)}`;

    const response =
      await fetch(url);

    const text =
      await response.text();

    const json =
      JSON.parse(
        text.substring(47).slice(0,-2)
      );

    const rows =
      json.table.rows;


    monsters =
      rows
        .map(row => {

          const cells =
            row.c || [];

          const monster = {

            name:
              cells[0]?.v ?? "",

            cr:
              parseCR(cells[1]?.v),

            xp:
              Number(cells[2]?.v ?? 0),

            unique:
              String(cells[3]?.v ?? "")
                .trim(),

            ddbHabitat:
              cells[4]?.v ?? "",

            habitats:{}

          };


          HABITATS.forEach((habitat,index)=>{

            monster.habitats[habitat.label] =
              Number(
                cells[5 + index]?.v ?? 0
              );

          });


          return monster;

        })
        .filter(m => m.name);


    buildHabitatFilters();

    filterMonsters();

  }catch(error){

    console.error(error);

    document.getElementById("tableBody").innerHTML = `
      <tr>
        <td colspan="6">
          Fehler beim Laden der Monsterdaten.
        </td>
      </tr>
    `;

  }

}


/* =========================================================
   CR
   ========================================================= */

function parseCR(value){

  if(value === undefined || value === null)
    return 0;

  const text =
    String(value).trim();

  if(text.includes("/")){

    const parts =
      text.split("/");

    return Number(parts[0]) / Number(parts[1]);

  }

  return Number(text) || 0;

}


/* =========================================================
   HABITAT FILTER
   ========================================================= */

function buildHabitatFilters(){

  const container =
    document.getElementById("habitatFilter");

  container.innerHTML = "";


  HABITATS.forEach(habitat => {

    const button =
      document.createElement("button");

    button.type = "button";

    button.textContent =
      habitat.label;


    if(
      selectedHabitats.includes(
        habitat.label
      )
    ){

      button.classList.add("active");

    }


    button.addEventListener("click",()=>{

      if(
        selectedHabitats.includes(
          habitat.label
        )
      ){

        selectedHabitats =
          selectedHabitats.filter(
            h => h !== habitat.label
          );

      }else{

        selectedHabitats.push(
          habitat.label
        );

      }


      buildHabitatFilters();
      filterMonsters();

    });


    container.appendChild(button);

  });

}


/* =========================================================
   HABITAT: ALLE
   ========================================================= */

document
  .getElementById("habitatAll")
  .addEventListener("click",()=>{

    selectedHabitats =
      HABITATS.map(
        habitat => habitat.label
      );

    buildHabitatFilters();
    filterMonsters();

  });


/* =========================================================
   HABITAT: KEINE
   ========================================================= */

document
  .getElementById("habitatNone")
  .addEventListener("click",()=>{

    selectedHabitats = [];

    buildHabitatFilters();
    filterMonsters();

  });


/* =========================================================
   FILTER
   ========================================================= */

function filterMonsters(){

  const search =
    document.getElementById("searchInput")
      .value
      .toLowerCase()
      .trim();


  const crMin =
    parseFloat(
      document.getElementById("crMin").value
    );


  const crMax =
    parseFloat(
      document.getElementById("crMax").value
    );


  const xpMin =
    parseFloat(
      document.getElementById("xpMin").value
    );


  const xpMax =
    parseFloat(
      document.getElementById("xpMax").value
    );


  let filtered =
    monsters.filter(monster => {


      if(
        !isNaN(crMin) &&
        monster.cr < crMin
      )
        return false;


      if(
        !isNaN(crMax) &&
        monster.cr > crMax
      )
        return false;


      if(
        !isNaN(xpMin) &&
        monster.xp < xpMin
      )
        return false;


      if(
        !isNaN(xpMax) &&
        monster.xp > xpMax
      )
        return false;


      if(
        uniqueState === "Ja" &&
        monster.unique !== "Ja"
      )
        return false;


      if(
        uniqueState === "Nein" &&
        monster.unique === "Ja"
      )
        return false;


      const combined =
        `${monster.name} ${monster.ddbHabitat}`
          .toLowerCase();


      if(
        search &&
        !combined.includes(search)
      )
        return false;


      /*
       * Mehrere Habitate:
       * Ein Monster bleibt zunächst im Ergebnis,
       * wenn es in mindestens einem ausgewählten
       * Habitat einen Wert > 0 hat.
       */

      if(selectedHabitats.length){

        const habitatMatch =
          selectedHabitats.some(
            habitat =>
              monster.habitats[habitat] > 0
          );

        if(!habitatMatch)
          return false;

      }


      return true;

    });


  /* =======================================================
     SORTIERUNG
     ======================================================= */

  filtered.sort((a,b)=>{

    let x;
    let y;


    switch(sortColumn){

      case "cr":

        x = a.cr;
        y = b.cr;

        break;


      case "xp":

        x = a.xp;
        y = b.xp;

        break;


      case "unique":

        x = a.unique;
        y = b.unique;

        break;


      default:

        x = a.name;
        y = b.name;

    }


    if(typeof x === "string"){

      x = x.toLowerCase();
      y = y.toLowerCase();

    }


    if(x < y)
      return sortDirection === "asc"
        ? -1
        : 1;


    if(x > y)
      return sortDirection === "asc"
        ? 1
        : -1;


    return 0;

  });


  renderTable(filtered);
  renderMobileCards(filtered);


  document
    .getElementById("resultCount")
    .textContent =
      filtered.length;

}


/* =========================================================
   HABITAT FIT
   ========================================================= */

function getHabitatFit(monster){

  if(!selectedHabitats.length)
    return null;


  const values =
    selectedHabitats.map(
      habitat =>
        monster.habitats[habitat] ?? 0
    );


  if(!values.length)
    return null;


  const total =
    values.reduce(
      (sum,value)=>sum + value,
      0
    );


  return (
    total / values.length
  ).toFixed(1);

}


/* =========================================================
   TABLE
   ========================================================= */

function renderTable(data){

  const body =
    document.getElementById("tableBody");

  body.innerHTML = "";


  data.forEach(monster => {

    const tr =
      document.createElement("tr");


    const uniqueClass =
      monster.unique === "Ja"
        ? "unique-yes"
        : "unique-no";


    const fit =
      getHabitatFit(monster);


    const habitatFit =
      fit === null
        ? "-"
        : `${fit} / 5`;


    tr.innerHTML = `

      <td>
        <strong>
          ${escapeHTML(monster.name)}
        </strong>
      </td>

      <td>
        ${formatCR(monster.cr)}
      </td>

      <td>
        ${monster.xp.toLocaleString("de-DE")}
      </td>

      <td class="${uniqueClass}">
        ${escapeHTML(monster.unique || "-")}
      </td>

      <td>
        ${escapeHTML(monster.ddbHabitat || "-")}
      </td>

      <td class="habitat-score">
        ${habitatFit}
      </td>

    `;


    body.appendChild(tr);

  });

}


/* =========================================================
   MOBILE
   ========================================================= */

function renderMobileCards(data){

  const container =
    document.getElementById("mobileCards");

  container.innerHTML = "";


  data.forEach(monster => {

    const fit =
      getHabitatFit(monster);


    const card =
      document.createElement("div");

    card.className =
      "mobile-card";


    card.innerHTML = `

      <div class="mobile-card-title">
        ${escapeHTML(monster.name)}
      </div>


      <div class="mobile-card-grid">

        <div>

          <div class="mobile-label">
            CR
          </div>

          <div class="mobile-value">
            ${formatCR(monster.cr)}
          </div>

        </div>


        <div>

          <div class="mobile-label">
            XP
          </div>

          <div class="mobile-value">
            ${monster.xp.toLocaleString("de-DE")}
          </div>

        </div>


        <div>

          <div class="mobile-label">
            Einzigartig
          </div>

          <div class="mobile-value">
            ${escapeHTML(monster.unique || "-")}
          </div>

        </div>


        <div>

          <div class="mobile-label">
            Habitat-Fit
          </div>

          <div class="mobile-score">
            ${
              fit === null
                ? "-"
                : `${fit} / 5`
            }
          </div>

        </div>


        <div style="grid-column:1 / -1;">

          <div class="mobile-label">
            DDB Habitat
          </div>

          <div class="mobile-value">
            ${escapeHTML(monster.ddbHabitat || "-")}
          </div>

        </div>

      </div>

    `;


    container.appendChild(card);

  });

}


/* =========================================================
   UNIQUE FILTER
   ========================================================= */

document
  .querySelectorAll(".unique-btn")
  .forEach(button => {

    button.addEventListener("click",()=>{

      document
        .querySelectorAll(".unique-btn")
        .forEach(btn =>
          btn.classList.remove("active")
        );


      button.classList.add("active");


      uniqueState =
        button.dataset.value;


      filterMonsters();

    });

  });


/* =========================================================
   INPUTS
   ========================================================= */

[
  "crMin",
  "crMax",
  "xpMin",
  "xpMax",
  "searchInput"
]
.forEach(id => {

  document
    .getElementById(id)
    .addEventListener(
      "input",
      filterMonsters
    );

});


/* =========================================================
   RESET
   ========================================================= */

document
  .getElementById("resetFilters")
  .addEventListener("click",()=>{

    document.getElementById("crMin").value = "";
    document.getElementById("crMax").value = "";

    document.getElementById("xpMin").value = "";
    document.getElementById("xpMax").value = "";

    document.getElementById("searchInput").value = "";

    uniqueState = "Alle";


    document
      .querySelectorAll(".unique-btn")
      .forEach(btn =>
        btn.classList.remove("active")
      );


    document
      .querySelector(
        '.unique-btn[data-value="Alle"]'
      )
      .classList.add("active");


    selectedHabitats = [];


    buildHabitatFilters();

    filterMonsters();

  });


/* =========================================================
   SORTIERUNG
   ========================================================= */

document
  .querySelectorAll(".sortable")
  .forEach(header => {

    header.addEventListener("click",()=>{

      const column =
        header.dataset.sort;


      if(sortColumn === column){

        sortDirection =
          sortDirection === "asc"
            ? "desc"
            : "asc";

      }else{

        sortColumn = column;
        sortDirection = "asc";

      }


      document
        .querySelectorAll(".sort-arrow")
        .forEach(arrow =>
          arrow.textContent = ""
        );


      header
        .querySelector(".sort-arrow")
        .textContent =
          sortDirection === "asc"
            ? "▲"
            : "▼";


      filterMonsters();

    });

  });


/* =========================================================
   SIDEBAR
   ========================================================= */

document
  .getElementById("toggleSidebar")
  .addEventListener("click",()=>{

    document
      .querySelector(".sidebar")
      .classList.toggle("open");

  });


document
  .getElementById("desktopToggleSidebar")
  .addEventListener("click",()=>{

    document
      .querySelector(".container")
      .classList.toggle(
        "sidebar-collapsed"
      );

  });


/* =========================================================
   SCROLL TOP
   ========================================================= */

const scrollTopBtn =
  document.getElementById(
    "scrollTopBtn"
  );


function isMobile(){

  return window.innerWidth <= 700;

}


function getCurrentScroll(){

  return isMobile()

    ? document.documentElement.scrollTop ||
      window.pageYOffset

    : document.querySelector(
        ".table-section"
      ).scrollTop;

}


function toggleScrollButton(){

  if(getCurrentScroll() > 300){

    scrollTopBtn.classList.add("show");

  }else{

    scrollTopBtn.classList.remove("show");

  }

}


window.addEventListener(
  "scroll",
  toggleScrollButton,
  { passive:true }
);


document
  .querySelector(".table-section")
  .addEventListener(
    "scroll",
    toggleScrollButton,
    { passive:true }
);


scrollTopBtn.addEventListener(
  "click",
  ()=>{

    if(isMobile()){

      window.scrollTo({
        top:0,
        behavior:"smooth"
      });

    }else{

      document
        .querySelector(".table-section")
        .scrollTo({
          top:0,
          behavior:"smooth"
        });

    }

  }
);


/* =========================================================
   HELPERS
   ========================================================= */

function formatCR(cr){

  if(cr === 0)
    return "0";


  if(cr < 1){

    return `1/${Math.round(1/cr)}`;

  }


  return Number.isInteger(cr)
    ? String(cr)
    : String(cr);

}


function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================================
   START

loadSheet();
