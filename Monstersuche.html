<script>

/* =========================================================
   GOOGLE SHEET
   ========================================================= */

const SHEET_ID =
  "1v7egXu70tpq7mkPCmZq4ak7fMu3NzZYPR1Rd2mLx8_0";

const SHEET_NAME =
  "Sheet1";


/* =========================================================
   SPALTEN
   =========================================================

   A = Monster
   B = DDB Link
   C = CR
   D = XP
   E = Einzigartig?
   F = Wald
   G = Grasland
   H = Wüste
   I = Sumpf
   J = Gebirge
   K = Küste
   L = Fluss/See
   M = Meer
   N = Höhle
   O = Untergrund
   P = Ruinen
   Q = Siedlung
   R = Kalt
   S = Gemäßigt
   T = Heiß

   ========================================================= */


/* =========================================================
   LEBENSRÄUME
   ========================================================= */

const HABITATS = [

  {
    label:"Wald",
    columnIndex:5
  },

  {
    label:"Grasland",
    columnIndex:6
  },

  {
    label:"Wüste",
    columnIndex:7
  },

  {
    label:"Sumpf",
    columnIndex:8
  },

  {
    label:"Gebirge",
    columnIndex:9
  },

  {
    label:"Küste",
    columnIndex:10
  },

  {
    label:"Fluss/See",
    columnIndex:11
  },

  {
    label:"Meer",
    columnIndex:12
  },

  {
    label:"Höhle",
    columnIndex:13
  },

  {
    label:"Untergrund",
    columnIndex:14
  },

  {
    label:"Ruinen",
    columnIndex:15
  },

  {
    label:"Siedlung",
    columnIndex:16
  }

];


/* =========================================================
   KLIMA
   ========================================================= */

const CLIMATES = [

  {
    label:"Kalt",
    columnIndex:17
  },

  {
    label:"Gemäßigt",
    columnIndex:18
  },

  {
    label:"Heiß",
    columnIndex:19
  }

];


/* =========================================================
   CR
   ========================================================= */

const CR_VALUES = [

  {
    label:"Alle",
    value:null
  },

  {
    label:"0",
    value:0
  },

  {
    label:"1/8",
    value:0.125
  },

  {
    label:"1/4",
    value:0.25
  },

  {
    label:"1/2",
    value:0.5
  }

];

for(
  let i = 1;
  i <= 30;
  i++
){

  CR_VALUES.push({
    label:String(i),
    value:i
  });

}


/* =========================================================
   STATE
   ========================================================= */

let monsters = [];


/*
 * Jedes ausgewählte Habitat bekommt
 * standardmäßig 3 Punkte Bedeutung.
 *
 * Beispiel:
 *
 * Wald -> 5
 * Fluss/See -> 3
 * Gebirge -> 2
 */

let regionWeights = {};


/*
 * Klima ist immer genau eines.
 */

let selectedClimate =
  "Gemäßigt";


/*
 * False = nur normale Monster
 * True = normale + einzigartige Monster
 */

let showUnique =
  false;


let sortColumn =
  "name";

let sortDirection =
  "asc";


/* =========================================================
   CR DROPDOWNS
   ========================================================= */

function buildCRDropdowns(){

  const minSelect =
    document.getElementById(
      "crMin"
    );

  const maxSelect =
    document.getElementById(
      "crMax"
    );


  minSelect.innerHTML = "";
  maxSelect.innerHTML = "";


  CR_VALUES.forEach(
    cr => {

      const minOption =
        document.createElement(
          "option"
        );

      minOption.value =
        cr.value === null
          ? ""
          : cr.value;

      minOption.textContent =
        cr.label;


      minSelect.appendChild(
        minOption
      );


      const maxOption =
        document.createElement(
          "option"
        );

      maxOption.value =
        cr.value === null
          ? ""
          : cr.value;

      maxOption.textContent =
        cr.label;


      maxSelect.appendChild(
        maxOption
      );

    }
  );


  minSelect.value = "";
  maxSelect.value = "";

}


/* =========================================================
   GOOGLE SHEET LADEN
   ========================================================= */

async function loadSheet(){

  try{

    const url =
      `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?sheet=${encodeURIComponent(SHEET_NAME)}`;


    const response =
      await fetch(
        url
      );


    if(!response.ok){

      throw new Error(
        `Google Sheets HTTP ${response.status}`
      );

    }


    const text =
      await response.text();


    const json =
      JSON.parse(
        text
          .substring(47)
          .slice(0,-2)
      );


    const rows =
      json.table.rows;


    monsters =
      rows
        .map(
          row => {

            const cells =
              row.c || [];


            const monster = {

              name:
                cells[0]?.v ?? "",


              link:
                getCellLink(
                  cells[1]
                ),


              cr:
                parseCR(
                  cells[2]?.f ??
                  cells[2]?.v
                ),


              xp:
                parseNumber(
                  cells[3]?.f ??
                  cells[3]?.v
                ),


              unique:
                String(
                  cells[4]?.f ??
                  cells[4]?.v ??
                  ""
                ).trim(),


              habitats:{},


              climates:{}

            };


            HABITATS.forEach(
              habitat => {

                monster.habitats[
                  habitat.label
                ] =
                  parseScore(
                    cells[
                      habitat.columnIndex
                    ]?.f ??
                    cells[
                      habitat.columnIndex
                    ]?.v
                  );

              }
            );


            CLIMATES.forEach(
              climate => {

                monster.climates[
                  climate.label
                ] =
                  parseScore(
                    cells[
                      climate.columnIndex
                    ]?.f ??
                    cells[
                      climate.columnIndex
                    ]?.v
                  );

              }
            );


            return monster;

          }
        )
        .filter(
          monster =>
            monster.name
        );


    buildHabitatUI();
    buildClimateUI();
    updateClimateUI();

    filterMonsters();


  }catch(error){

    console.error(
      "Fehler beim Laden der Monsterdaten:",
      error
    );


    document.getElementById(
      "tableBody"
    ).innerHTML = `

      <tr>

        <td colspan="7">
          Fehler beim Laden der Monsterdaten.
        </td>

      </tr>

    `;

  }

}


/* =========================================================
   LINK
   ========================================================= */

function getCellLink(cell){

  if(!cell)
    return "";


  if(cell.u)
    return cell.u;


  if(cell.href)
    return cell.href;


  if(cell.link)
    return cell.link;


  const value =
    String(
      cell.v ?? ""
    ).trim();


  if(
    value.startsWith("http://") ||
    value.startsWith("https://")
  ){

    return value;

  }


  return "";

}


/* =========================================================
   ZAHLEN
   ========================================================= */

function parseNumber(value){

  if(
    value === undefined ||
    value === null ||
    value === ""
  ){

    return 0;

  }


  if(
    typeof value === "number"
  ){

    return value;

  }


  const text =
    String(value)
      .trim()
      .replace(/\./g,"")
      .replace(",", ".");


  return Number(text) || 0;

}


/* =========================================================
   CR
   ========================================================= */

function parseCR(value){

  if(
    value === undefined ||
    value === null ||
    value === ""
  ){

    return 0;

  }


  let text =
    String(value)
      .trim()
      .toLowerCase()
      .replace(
        /^cr\s*/,
        ""
      );


  if(
    text.includes("/")
  ){

    const parts =
      text.split("/");


    const numerator =
      Number(
        parts[0].trim()
      );


    const denominator =
      Number(
        parts[1].trim()
      );


    if(
      !isNaN(numerator) &&
      !isNaN(denominator) &&
      denominator !== 0
    ){

      return (
        numerator /
        denominator
      );

    }

  }


  const unicodeFractions = {

    "⅛":0.125,
    "¼":0.25,
    "½":0.5

  };


  if(
    Object.prototype.hasOwnProperty.call(
      unicodeFractions,
      text
    )
  ){

    return unicodeFractions[text];

  }


  const number =
    Number(
      text.replace(",",".")
    );


  return isNaN(number)
    ? 0
    : number;

}


/* =========================================================
   1–5 SCORE
   ========================================================= */

function parseScore(value){

  if(
    value === undefined ||
    value === null ||
    value === ""
  ){

    return null;

  }


  const number =
    Number(
      String(value)
        .replace(",",".")
        .trim()
    );


  if(
    isNaN(number)
  ){

    return null;

  }


  return Math.max(
    1,
    Math.min(
      5,
      number
    )
  );

}


/* =========================================================
   HABITAT UI
   ========================================================= */

function buildHabitatUI(){

  const container =
    document.getElementById(
      "regionProfiles"
    );


  container.innerHTML = "";


  HABITATS.forEach(
    habitat => {

      const row =
        document.createElement(
          "div"
        );


      row.className =
        "region-row";


      const name =
        document.createElement(
          "div"
        );

        );

        );

          stars,
          habitat.label
        );

          document.createElement(
            "button"
          );


        selectButton.textContent =
          "Auswählen";

          "auto";

        selectButton.style.padding =
          "5px 8px";

        selectButton.style.fontSize =
          "12px";

        selectButton.style.background =

             * Neue Region:

             */

            updateHabitatQuickButton();

        );

          );

        removeButton.style.width =

        removeButton.style.padding =
          "4px";

        removeButton.style.background =
          "transparent";

          "none";

            updateHabitatQuickButton();
            filterMonsters();

/* =========================================================
   STERNE FÜR REGION
   ========================================================= */

function buildRegionStars(
  container,
  habitat
){

  const current =
    regionWeights[
      habitat
    ];


  for(
    let i = 1;
    i <= 5;
    i++
  ){

    const star =
      document.createElement(
        "button"
      );


    star.className =
      "region-star";


    star.textContent =
      "★";


    if(
      i <= current
    ){

      star.classList.add(
        "active"
      );

    }


    star.title =
      `${i}/5`;


    star.addEventListener(
      "click",
      ()=>{
        
        regionWeights[
          habitat
        ] = i;


        buildHabitatUI();
        filterMonsters();

      }
    );


    container.appendChild(
      star
    );

  }

}

/* =========================================================
   FILTER
   ========================================================= */

function filterMonsters(){

  const search =
    document
      .getElementById(
        "searchInput"
      )
      .value
      .toLowerCase()
      .trim();


  const crMinValue =
    document
      .getElementById(
        "crMin"
      )
      .value;


  const crMaxValue =
    document
      .getElementById(
        "crMax"
      )
      .value;


  const crMin =
    crMinValue === ""
      ? null
      : Number(
          crMinValue
        );


  const crMax =
    crMaxValue === ""
      ? null
      : Number(
          crMaxValue
        );


  const xpMin =
    parseFloat(
      document
        .getElementById(
          "xpMin"
        )
        .value
    );


  const xpMax =
    parseFloat(
      document
        .getElementById(
          "xpMax"
        )
        .value
    );


  let filtered =
    monsters.filter(
      monster => {


        if(
          !showUnique &&
          monster.unique === "Ja"
        ){

          return false;

        }


        if(
          crMin !== null &&
          monster.cr < crMin
        ){

          return false;

        }


        if(
          crMax !== null &&
          monster.cr > crMax
        ){

          return false;

        }


        if(
          !isNaN(xpMin) &&
          monster.xp < xpMin
        ){

          return false;

        }


        if(
          !isNaN(xpMax) &&
          monster.xp > xpMax
        ){

          return false;

        }


        if(
          search &&
          !monster.name
            .toLowerCase()
            .includes(search)
        ){

          return false;

        }


        /*
         * Wenn Regionen ausgewählt wurden:
         * Monster müssen zumindest einen
         * bewerteten Wert für eines davon haben.
         */

        if(
          Object.keys(
            regionWeights
          ).length
        ){

          const hasRelevantHabitat =
            Object.keys(
              regionWeights
            ).some(
              habitat =>
                monster.habitats[
                  habitat
                ] !== null
            );


          if(
            !hasRelevantHabitat
          ){

            return false;

          }

        }


        return true;

      }
    );


  /* =======================================================
     SORTIERUNG
     ======================================================= */

  filtered.sort(
    (a,b)=>{

      let x;
      let y;


      switch(sortColumn){

        case "cr":

          x = a.cr;
          y = b.cr;

          break;


        case "xp":

          x = a.xp;
          y = b.xp;

          break;


        case "total":

          x =
            getTotalScore(a);

          y =
            getTotalScore(b);

          break;


        case "habitat":

          x =
            getHabitatScore(a);

          y =
            getHabitatScore(b);

          break;


        case "climate":

          x =
            getClimateScore(a);

          y =
            getClimateScore(b);

          break;


        default:

          x =
            a.name;

          y =
            b.name;

      }


      if(
        typeof x === "string"
      ){

        x =
          x.toLowerCase();

        y =
          y.toLowerCase();

      }


      if(x === null)
        x = -1;

      if(y === null)
        y = -1;


      if(x < y){

        return sortDirection === "asc"
          ? -1
          : 1;

      }


      if(x > y){

        return sortDirection === "asc"
          ? 1
          : -1;

      }


      return 0;

    }
  );


  renderTable(
    filtered
  );


  renderMobileCards(
    filtered
  );


  document
    .getElementById(
      "resultCount"
    )
    .textContent =
      filtered.length;

}


/* =========================================================
   LEBENSRAUM SCORE
   =========================================================

   Derzeit:
   Nur ausgewählte Regionen werden bewertet.
   Ihre Bedeutung wird durch den 1–5 Wert
   gewichtet.

   Die Monsterwerte bleiben 1–5.

   ========================================================= */

function getHabitatScore(monster){

  const habitats =
    Object.keys(
      regionWeights
    );


  if(!habitats.length)
    return null;


  let weightedScore = 0;
  let totalWeight = 0;


  habitats.forEach(
    habitat => {

      const regionWeight =
        regionWeights[
          habitat
        ];


      const monsterScore =
        monster.habitats[
          habitat
        ];


      if(
        monsterScore !== null &&
        monsterScore !== undefined
      ){

        weightedScore +=
          monsterScore *
          regionWeight;

        totalWeight +=
          regionWeight;

      }

    }
  );


  if(
    totalWeight === 0
  ){

    return null;

  }


  return (
    weightedScore /
    totalWeight
  );

}


/* =========================================================
   KLIMA SCORE
   ========================================================= */

function getClimateScore(monster){

  if(
    !selectedClimate
  ){

    return null;

  }


  return (
    monster.climates[
      selectedClimate
    ] ?? null
  );

}


/* =========================================================
   GESAMT
   =========================================================

   Vorläufig:
   50 % Lebensraum
   50 % Klima

   Die endgültige Gewichtung kommt später.

   ========================================================= */

function getTotalScore(monster){

  const habitat =
    getHabitatScore(
      monster
    );


  const climate =
    getClimateScore(
      monster
    );


  if(
    habitat === null &&
    climate === null
  ){

    return null;

  }


  if(
    habitat === null
  ){

    return climate;

  }


  if(
    climate === null
  ){

    return habitat;

  }


  return (
    habitat +
    climate
  ) / 2;

}


/* =========================================================
   STERNE
   ========================================================= */

function getStars(score){

  if(
    score === null ||
    score === undefined
  ){

    return "—";

  }


  const rounded =
    Math.max(
      1,
      Math.min(
        5,
        Math.round(score)
      )
    );


  return (
    "★".repeat(
      rounded
    ) +
    "☆".repeat(
      5 - rounded
    )
  );

}


/* =========================================================

function renderHabitatDetails(monster){

  const details = [];


  Object.keys(
    regionWeights
  ).forEach(
    habitat => {

      const score =
        monster.habitats[
          habitat
        ];


      if(
        score !== null &&
        score !== undefined
      ){

        details.push(`

          <span class="score-detail-item">

            <span class="score-detail-name">
              ${escapeHTML(
                habitat
              )}
            </span>

            <span class="score-detail-stars">
              ${getStars(
                score
              )}
            </span>

          </span>

        `);

      }

    }
  );


  return details.join("");

}

function formatScore(score){

  if(
    score === null ||
    score === undefined
  ){

    return "—";

  }


  return score.toFixed(1);

}

/* =========================================================
   FORMATIERUNG
   ========================================================= */

function formatCR(cr){

  if(cr === 0)
    return "0";


  const knownFractions = {

    0.125:"1/8",
    0.25:"1/4",
    0.5:"1/2"

  };


  if(
    Object.prototype.hasOwnProperty.call(
      knownFractions,
      cr
    )
  ){

    return knownFractions[cr];

  }


  if(
    Number.isInteger(cr)
  ){

    return String(cr);

  }


  return String(
    Number(
      cr.toFixed(3)
    )
  );

}


/* =========================================================
   HTML SICHERN
   ========================================================= */

function escapeHTML(value){

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


function escapeAttribute(value){

  return escapeHTML(
    value
  );

}
